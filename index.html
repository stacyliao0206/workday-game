      run(S){ S.A.stage='planned'; S.flags.plan='booth'; mark(S,'good','依各部門量能提出可行方案'); fx(S,{co:-1,why:{co:'行政要多準備攤位物資。'}}); rec(S,'P','方案比較','新場次改自由體驗攤位，不用講師；行政物資增加。'); return '方案寫好了：加兩場自由體驗攤位，小一也能玩。下一步：送主管核可。'; }},
    {id:'p3', st:'desk', grp:'P', when:S=>S.A.stage==='eval' && S.flags.capKnown,
      label:'全部照辦，請各部門加班', hint:'對方最滿意。', cost:()=>({min:10,en:2}),
      run(S){ S.A.stage='planned'; S.flags.plan='all'; S.flags.overtime=true; mark(S,'bad','不顧各部門量能，全部照辦'); fx(S,{co:-6,why:{co:'三個部門都要加班。'}}); rec(S,'P','方案比較','全部照辦，三個部門都要加班。'); return '方案寫好了：兩場都加、年齡下修。下一步：送主管核可。'; }},
    /* 補救：已經說「應該可以」 */
    {id:'R1', st:'desk', grp:'R', when:S=>S.A.stage==='fix',
      label:'回頭協商：改成加一場、年齡不變，正式說明原因', who:'教育局承辦', cost:()=>({min:25,en:5}),
      run(S){ S.A.stage='planned'; S.flags.plan='one'; S.flags.remedy='R1'; fx(S,{co:-3,why:{co:'陳小姐要回去跟長官改口。'}}); rec(S,'R','補救：回頭協商','陳小姐要回去跟長官改口；主管也要出面說明。'); return '陳小姐有點為難，但接受了。主管要出面打電話致意。下一步：送主管核可。'; }},
    {id:'R2', st:'desk', grp:'R', when:S=>S.A.stage==='fix',
      label:'改成自由體驗攤位，不需要講師', who:'行政', cost:()=>({min:20,en:4}),
      run(S){ S.A.stage='planned'; S.flags.plan='booth'; S.flags.remedy='R2'; fx(S,{co:-2,why:{co:'行政物資增加。'}}); rec(S,'R','補救：改自由體驗攤位','場次保住了，行政物資增加。'); return '新場次改成自由體驗攤位。下一步：送主管核可。'; }},
    {id:'R3', st:'desk', grp:'R', when:S=>S.A.stage==='fix',
      label:'請各部門加班支援', who:'教學、研發、行政', cost:()=>({min:10,en:2}),
      run(S){ S.A.stage='planned'; S.flags.plan='all'; S.flags.overtime=true; S.flags.remedy='R3'; fx(S,{co:-6,why:{co:'三個部門都要加班。'}}); rec(S,'R','補救：請各部門加班','對外的承諾保住了，其他部門的工作往後延。'); return '三個部門都答應加班，但語氣不太好。下一步：送主管核可。'; }},
    /* 主管核可、寄出方案 */

    {id:'s_send', st:'desk', grp:'S', when:S=>S.A.stage==='approved',
      label:'寄方案給合作單位，說明可行與不可行的部分', who:'教育局承辦', cost:()=>({min:10,en:2}),

    },
    id:'hr', deptName:'人資及行政部', hero:'jing', heroName:'小晶', heroJob:'行政專員', endLabel:'18:00', softEndT:T(17,30),
    TASK_META, EVENTS, CALLS, ACTIONS, GROUP_TITLE, newGame, taskView, taskKeys, nextStationFor, extraRows:()=>[], StationInfo, buildEnding,

   部門設定：行銷及設計部（第一個完成的部門）
   ========================================================= */
const DESIGN_ROLE = {
  cardV2:true, CARD:{
    S1:S=>({tab:'DM 修改', title:'小禾傳來「最後一個小修改」', meta:[{hi:'17:00',t:' 印刷廠收件'}], body:'要怎麼處理這次修改？', info:true}),
    R:S=>({tab:'DM 補救', title:'第二份修改來了', meta:['已經花掉的時間不會回來'], body:'版面放不下，要怎麼補救？', info:true}),
    S2:S=>({tab:'秋季課宣傳圖', title:'開課日和費用還寫著「待確認」', meta:['對外宣傳要經過主管審核'], body:'宣傳圖要怎麼做？', info:true}),
    S3:S=>({tab:'教具打樣', title:'回覆工廠', meta:[{hi:'16:00',t:' 前回覆工廠'}], body:'依照你的分類回覆，或先和老師談。', info:true}),
    S4:S=>({tab:'營隊課本', title:'營隊課本內頁排版', meta:[{hi:'17:30',t:' 前交研發部小宇校對'}], body:'你會採用哪一種排版輸出？', info:true}),
  },
  id:'design', deptName:'行銷及設計部', hero:'an', heroName:'小安', heroJob:'設計師', endLabel:'18:00', softEndT:T(17,0),
  TASK_META, EVENTS, CALLS, ACTIONS, GROUP_TITLE, STATIONS, TIMER_LABEL, newGame, taskView, taskKeys, nextStationFor, nextDeadline, buildEnding, StationInfo, Scene, stationBadge,
  extraRows: S => S.teacherNote==='todo' ? [{key:'note', time:'—', name:'告知徐老師哪些意見留到下一版', next:'小任務，約 10 分鐘', tag:'todo', tagText:'待處理', station:'sample', rank:10}] : [],
  scoreExtras: (S,H) => (S.teacherNote==='todo' && H.note!=='notify') ? [{t:S.t,kind:'bad',text:'沒告訴徐老師哪些意見沒有採用'}] : [],
  handoff:{ helperLabel:'交給阿哲，附上說明', helperDone:'交給阿哲，附上說明', helperOk:S=>!S.flags.azheBusy, helperWhy:'（阿哲今天已支援過）',
    extras: S => S.teacherNote==='todo' ? [{k:'note', v:{name:'告知徐老師哪些意見留到下一版', note:'徐老師還不知道哪些意見沒有採用', label:'待處理', st:'todo'}}] : [],
    overtime:{ key:'A', minutes: remainingA } },
  brief:{ sub:'行銷及設計部 · 星期四下午', title:'送印前的最後一次修改', intro:'你是設計師<b>小安</b>。13:30 回到座位，18:00 下班。今天桌上有三件事：', tasks:['A','B','C'], more:'', how:'點辦公室裡的物件（電腦、需求單架、打樣盒、電話⋯）走過去處理。順序由你決定。' },
  about:'印刷廠 17:00 收件；打樣後可以調整顏色、生產數量，尺寸和材質可能影響成本，不建議大幅修改；時間太趕時，調色不重新打樣。其餘情節為虛構。',
};
const ROLE_DEFS = { design: ()=>{ DAY_START=13*60+30; return DESIGN_ROLE; }, course: makeCourse, rd: makeRD, teach: makeTeach, finance: makeFinance, eng: makeEng, project: makeProject, hr: makeHR, video: makeVideo };
function makeRole(id){ return (ROLE_DEFS[id]||ROLE_DEFS.design)(); }

/* ---- 主程式 ---- */
function App({init}){
  if(!R) R = makeRole((init.S && init.S.role) || 'design');
  const [screen,setScreen]=useState(init.screen||'home');
  const [S,setS]=useState(init.S||null);
  const [settings,setSettings]=useState(init.settings||{cd:'std'});
  const [H,setH]=useState(init.H||{});
  const [station,setStation]=useState(null);
  const [cardOpen,setCardOpen]=useState(false);
  const [tab,setTab]=useState('work');
  const [dialog,setDialog]=useState(null);
  const [working,setWorking]=useState(null);
  const [seen,setSeen]=useState(1);
  const [hiddenTab,setHiddenTab]=useState(document.hidden);
  const ref=useRef({}); Object.assign(ref.current,{screen,S,settings,H});

  useEffect(()=>{ try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(()=>({screen:ref.current.screen,S:ref.current.S,settings:ref.current.settings,H:ref.current.H})); }catch(e){} },[]);
  useEffect(()=>{ const f=()=>setHiddenTab(document.hidden); document.addEventListener('visibilitychange',f); return ()=>document.removeEventListener('visibilitychange',f); },[]);
  useEffect(()=>{ window.scrollTo(0,0); },[screen]);

  const apply=fn=>setS(prev=>{ const d=structuredClone(prev); fn(d); return d; });
  const paused = dialog==='settings';

  // 倒數：暫停、設定視窗開啟、分頁在背景時都停止
  const counting = !!(S && S.countdown);
  useEffect(()=>{
    if(!counting) return;
    const iv=setInterval(()=>{
      if(document.hidden || ref.current.pausedNow) return;
      setS(prev=>{ if(!prev||!prev.countdown) return prev; const d=structuredClone(prev); d.countdown.left=Math.max(0,d.countdown.left-0.25); if(d.countdown.left<=0) timeoutCall(d); return d; });
    },250);
    return ()=>clearInterval(iv);
  },[counting]);
  ref.current.pausedNow=paused;

  // 本局 8 分鐘倒數（現實時間）：暫停或分頁在背景時停止
  const inRound = screen==='game' && !!S && !S.dayOver;
  useEffect(()=>{
    if(!inRound) return;
    const iv=setInterval(()=>{
      if(document.hidden || ref.current.pausedNow) return;
      setS(prev=>{ if(!prev) return prev; const left=(prev.realLeft==null?CONFIG.roundSec:prev.realLeft); if(left<=0) return prev; return {...prev, realLeft:left-1}; });
    },1000);
    return ()=>clearInterval(iv);
  },[inRound]);

  const pickRole = id => { R = makeRole(id); setScreen('brief'); };
  if(screen==='home') return html`<${Home} go=${setScreen} pick=${pickRole}/>`;
  if(screen==='roles') return html`<${Roles} back=${()=>setScreen('home')} pick=${pickRole}/>`;
  if(screen==='brief') return html`<${Brief} settings=${settings} setSettings=${setSettings} back=${()=>setScreen('roles')} start=${()=>{ setS(R.newGame()); setH({}); setStation(null); setTab('work'); setSeen(1); setScreen('game'); }}/>`;
  if(screen==='handoff') return html`<${Handoff} S=${S} H=${H} setH=${setH} finish=${()=>setScreen('ending')}/>`;
  if(screen==='ending') return html`<${Ending} S=${S} H=${H} replay=${()=>{ setS(R.newGame()); setH({}); setStation(null); setTab('work'); setSeen(1); setScreen('game'); }} toRoles=${()=>{ setS(null); setScreen('roles'); }} toBoard=${()=>setScreen('board')}/>`;
  if(screen==='board') return html`<${Board} dept=${R && S ? R.id : null} back=${()=>setScreen(S?'ending':'home')} backLabel=${S?'回到今天的回顧':'回首頁'}/>`;

  /* ---- game ---- */
  const openStation=id=>{ setStation(id); setTab('work'); setCardOpen(true); if(S.alert && S.alert.station===id) apply(d=>{ d.alert=null; }); };
  const closeCard=()=>setCardOpen(false);
  const run=a=>{
    if(working||S.dayOver||ref.current.busy) return;
    ref.current.busy=true;
    const c=L(a.cost,S);
    const reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setWorking({label:L(a.label,S), min:c.min});
    setTimeout(()=>{ apply(d=>{ const act=R.ACTIONS.find(x=>x.id===a.id)||a; doAction(d,act); d.lastStation=station; }); setWorking(null); ref.current.busy=false; }, reduce?0:500);
  };
  const answer=o=>{
    const call=R.CALLS[S.phone.id];
    if(call.timed && !o){ setCardOpen(false); apply(d=>{ d.phone.answered=true; if(settings.cd!=='off'){ const sec=CONFIG.countdownSec[settings.cd]; d.countdown={left:sec,total:sec}; } }); return; }
    if(o) apply(d=>{ const opt=R.CALLS[d.phone.id].options(d).find(x=>x.id===o.id); d.countdown=null; d.phone.answered=true; doAction(d,opt); d.lastStation='phone'; nextPhone(d); });
  };
  const advanceNext=()=>apply(d=>{ const n=nextTimer(d); if(!n) return; const from=d.t; const before={en:d.en,q:d.q,co:d.co}; advance(d,n.at-d.t); d.last={label:'推進時間', from, to:d.t, text:'時間來到 '+clock(d.t)+'。', d:{en:d.en-before.en,q:d.q-before.q,co:d.co-before.co}}; d.lastStation=station; });

  const timedOpen = S.phone && R.CALLS[S.phone.id].timed && S.phone.answered;
  const unread = Math.max(0, S.feed.length - seen);
  const realLeft = S.realLeft==null ? CONFIG.roundSec : S.realLeft;
  const canEnd = S.dayOver || realLeft<=0 || (S.flags.t1Done && S.flags.t2Done && (S.t>=R.softEndT || allResolved(S)));
  const mmss = v => String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');

  return html`<div className="wrap gamewrap">
    <header className="card top">
      <div className="who"><div className="avatar" aria-hidden="true"><${Portrait} who=${R.hero} size=${40}/></div><div><b>${R.heroName}</b><div className="muted" style=${{fontSize:'13px'}}>${R.deptName} · ${R.heroJob}</div></div></div>
      <div className="clockbox"><span className="clock" aria-label=${'現在時間 '+clock(S.t)}>${clock(S.t)}</span><small>下班 ${R.endLabel}</small></div>
      <div className=${'realtimer'+(realLeft<=60?' low':'')+(realLeft<=0?' over':'')} role="timer" aria-label=${'本局剩餘 '+mmss(realLeft)}>
        <span className="rt-k">本局剩餘</span><span className="rt-v mono">${realLeft>0?mmss(realLeft):'時間到'}</span>
        <span className="rt-bar"><i style=${{width:(realLeft/CONFIG.roundSec*100)+'%'}}></i></span>
        ${paused && html`<span className="rt-p">已暫停</span>`}
      </div>
      <div className="dl"><span className="muted">下一個期限</span><br/><b>${R.nextDeadline(S)}</b></div>
      <span className="spacer"></span>
      <button className="btn small" disabled=${!canEnd} onClick=${()=>setDialog('end')} title="兩通限時電話都處理過，並且接近下班或工作都有著落時，可以收工">收工交接</button>
      <button className="btn small" onClick=${()=>setDialog('settings')} aria-label="暫停與設定"><${Icon} n="pause"/>暫停／設定</button>
      <${Meters} S=${S}/>
    </header>

    ${S.phone && !timedOpen && html`<div className="ring" role="alert"><${Icon} n="phone"/><b>${R.CALLS[S.phone.id].scene ? R.CALLS[S.phone.id].label : '電話響了：'+R.CALLS[S.phone.id].from}</b>
      ${R.CALLS[S.phone.id].timed && html`<${Chip} st="waiting">限時事件</${Chip}>`}<span className="spacer" style=${{flex:1}}></span>
      ${R.CALLS[S.phone.id].scene ? html`<button className="btn small primary" onClick=${()=>answer()}>立即處理</button>` : html`<button className="btn small primary" onClick=${()=>openStation('phone')}>到電話接聽</button>`}</div>`}
    <${AlertBar} S=${S} go=${openStation} dismiss=${()=>apply(d=>{ d.alert=null; })}/>
    ${realLeft<=0 && !S.dayOver && html`<div className="ring" role="alert" style=${{borderColor:'var(--bad)',background:'var(--bad-soft)'}}><b>8 分鐘到了</b><span className="muted">可以直接收工交接，未完成的事會在交接時安排去向。</span><span style=${{flex:1}}></span><button className="btn small primary" onClick=${()=>setScreen('handoff')}>收工交接</button></div>`}
    ${S.dayOver && html`<div className="ring" role="alert" style=${{borderColor:'var(--accent)',background:'var(--accent-soft)'}}><b>${R.dayOverText || (R.endLabel+' 下班時間到了')}</b><span className="muted">還沒完成的事，可以在交接時安排去向。</span><span style=${{flex:1}}></span><button className="btn small primary" onClick=${()=>setScreen('handoff')}>進入收工交接</button></div>`}

    <div className="cols">
      <div className=${'pane'+(tab==='tasks'?' on':'')}><${TaskBoard} S=${S} go=${openStation}/></div>
      <div className=${'pane'+(tab==='work'?' on':'')}>
        <${R.Scene} S=${S} station=${station} open=${openStation}/>
        <${NextStep} S=${S} go=${openStation} advanceNext=${advanceNext}/>
      </div>
      <div className=${'pane'+(tab==='feed'?' on':'')}><${Feed} S=${S} advanceNext=${advanceNext}/></div>
      <div className=${'pane'+(tab==='status'?' on':'')} style=${{display:tab==='status'?undefined:'none'}}>
        <div className="card panel"><h2><${Icon} n="gauge"/>狀態說明</h2>
          ${[['工作進度','今天的工作中，已完成或已安排延後的數量。'],['品質／正確度',S.why.q],['協作順暢度',S.why.co],['個人精力',S.why.en]].map(([n,w])=>html`<p key=${n} style=${{marginBottom:'8px'}}><b>${n}</b><br/><span className="muted">${w}</span></p>`)}
          <p className="muted" style=${{fontSize:'13px'}}>數值只是遊戲模型，不代表真實績效。</p></div>
      </div>
    </div>

    <nav className="tabbar" role="tablist" aria-label="遊戲分頁">
      ${[['work','工作區','map'],['tasks','工作單','list'],['feed','動態','feed'],['status','狀態','gauge']].map(([k,l,ic])=>html`<button key=${k} role="tab" aria-selected=${tab===k} onClick=${()=>{ setTab(k); if(k==='feed') setSeen(S.feed.length); }}>
        <${Icon} n=${ic}/>${l}${k==='feed'&&unread>0&&tab!=='feed'?html`<span className="dot">${unread}</span>`:''}${k==='work'&&S.phone?html`<span className="dot">☎</span>`:''}</button>`)}
    </nav>

    ${cardOpen && station && !timedOpen && html`<div className="overlay" role="dialog" aria-modal="true" aria-label=${R.STATIONS[station].name} onClick=${e=>{ if(e.target===e.currentTarget) closeCard(); }} onKeyDown=${e=>{ if(e.key==='Escape') closeCard(); }}>
      <div className="card dialog wide"><${StationPanel} S=${S} id=${station} run=${run} apply=${apply} answer=${answer} working=${working} close=${closeCard}/></div></div>`}
    ${timedOpen && html`<${TimedCall} S=${S} choose=${o=>answer(o)} settings=${settings} hidden=${hiddenTab} paused=${paused}/>`}
    ${dialog==='settings' && html`<${SettingsDialog} settings=${settings} setSettings=${v=>{ setSettings(v); if(v.cd==='off') apply(d=>{ d.countdown=null; }); }} close=${()=>setDialog(null)}
        restart=${()=>setDialog('restart')} toRoles=${()=>setDialog('roles')}/>`}
    ${dialog==='restart' && html`<${Confirm} text=${'這一局的進度會清除，從 '+clock(0)+' 重新開始。'} yes=${()=>{ setS(R.newGame()); setH({}); setStation(null); setSeen(1); setDialog(null); }} no=${()=>setDialog('settings')}/>`}
    ${dialog==='roles' && html`<${Confirm} text="這一局的進度會清除，回到部門選擇。" yes=${()=>{ setS(null); setDialog(null); setScreen('roles'); }} no=${()=>setDialog('settings')}/>`}
    ${dialog==='end' && html`<${Confirm} text=${'現在 '+clock(S.t)+'。收工後不能再處理工作，未完成的事會進入交接。'} yes=${()=>{ setDialog(null); setScreen('handoff'); }} no=${()=>setDialog(null)}/>`}
  </div>`;
}

function start(data){
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} init=${data||{}}/>`);
}
const hot = window.claude && window.claude.hot;
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

</body>
</html>
