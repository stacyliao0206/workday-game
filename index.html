<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="數感實驗室跨部門工作體驗遊戲：九個部門，九種上班日。">
<meta property="og:title" content="今天換你上班｜數感實驗室跨部門工作體驗遊戲">
<meta property="og:description" content="九個部門，九種上班日。你會接到需求、等回覆、被臨時電話打斷，也會看到自己的安排怎麼牽動其他同事。">
<meta property="og:image" content="chars/brand-team.webp">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<title>今天換你上班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: 選角頁是等角視角的公司地圖（中鼎大樓＋美數學院教室）與右側角色卡；遊戲頁左工作單、中辦公室、右動態，手機改下方分頁 */
:root{
  --bg:#F4EBE2; --surface:#FFFBF7; --surface2:#F7EEE6; --ink:#24201F; --muted:#76675D; --line:#E2D3C6;
  --accent:#C9572F; --accent-ink:#FFFFFF; --accent-soft:#FBE4D8;
  --sun:#E9B732; --sun-soft:#FCF0CC; --teal:#2F7684; --teal-soft:#DCEDEF; --coral:#D9643A; --coral-soft:#FBE3D8; --violet:#6C5AA6;
  --floor:#FBF4EA; --floorline:#EFE3D2; --desk:#DCC6A3; --desk-edge:#B99B70; --wall:#6E5F55;
  --ok:#2B7A4B; --ok-soft:#E1F1E7; --warn:#9A5B00; --warn-soft:#FCEFD6; --bad:#B23B26; --bad-soft:#F8E1DA;
  --isle-top:#E7DCC8; --isle-side:#C9B596; --grass:#BCD1A6; --slab:#E3D5C3; --floor-top:#F7EFE4; --window:#BFD9DE; --board:#2F5446; --chalk:#F4F1E6;
  --tree:#6F9A73; --tree2:#4F7D5C; --trunk:#8A6A4E; --skin1:#F7DBC6; --skin2:#F3D0B4; --skin3:#EFC9AB;
  --ana-green:#87C239; --ana-pink:#F8CBC3; --ana-ink:#4B4948; --ana-wall:#F3EEE6; --hair1:#3A2C27; --hair2:#7A4B2E; --paper:#FFFFFF;
  --d-course:#2F7684; --d-video:#6C5AA6; --d-design:#D9643A; --d-finance:#4E8A62; --d-teach:#E2A92B; --d-project:#3F64A8; --d-hr:#B2577A; --d-eng:#3A4A66; --d-rd:#8A7A2E;
  --map-bg1:#FFFCF8; --map-bg2:#F1E4D6;
  --shadow:0 1px 2px rgba(36,32,31,.08),0 6px 18px rgba(36,32,31,.07);
  --font-display:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
/* 固定淺色：不跟隨系統或平台的深色模式 */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,var(--map-bg1) 0%,var(--bg) 55%) var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.3;font-weight:900;letter-spacing:.01em}
h3{font-weight:700}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:6px 14px;font-weight:500;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.chip.todo{background:var(--accent-soft);color:var(--accent)}
.chip.doing{background:var(--teal-soft);color:var(--teal)}
.chip.waiting{background:var(--sun-soft);color:var(--warn)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.fix{background:var(--coral-soft);color:var(--bad);border-color:var(--coral)}
.chip.deferred{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.chip.cost{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.chip.up{background:var(--ok-soft);color:var(--ok)}
.chip.down{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.ico{width:1em;height:1em;flex:none;vertical-align:-.12em}

/* home */
.hero{display:grid;gap:28px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;padding-block:24px}
.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:.02em}
.hero .kicker{font-family:var(--font-mono);font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.hero .lead{font-size:17px;max-width:32em;margin-top:14px}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.punch{width:100%;max-width:360px;justify-self:center}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
.notes .card{padding:16px 18px}
.notes h3{font-size:18px;margin-bottom:4px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.notes{grid-template-columns:1fr}.punch{max-width:280px}}

/* roles */
.roles-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.role{padding:16px 18px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-height:168px}
.role.locked{cursor:default;background:var(--surface2);box-shadow:none}
.role .dept{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.role h3{font-size:20px}
.role.open{border:2px solid var(--accent)}
@media (max-width:900px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.roles{grid-template-columns:1fr}.role{min-height:0}}

/* role map */
.kicker{font-family:var(--font-mono);font-size:13px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
.maptitle{font-size:clamp(28px,4.4vw,42px)}
.maptools{display:flex;flex-wrap:wrap;gap:8px}
.maptools .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.mapgrid > *{min-width:0}
.roles-head > *{min-width:0}
@media (max-width:980px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapcard{overflow:hidden;padding:0}
.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mapscroll svg{display:block;width:100%;min-width:720px;height:auto}
.mapcard .hint{padding:8px 14px 10px;border-top:1px solid var(--line)}
.pp{cursor:pointer}
.pp .hit{fill:transparent}
.pp .halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.pp.open .halo{opacity:.45}
.pp:hover .halo,.pp:focus-visible .halo,.pp.sel .halo{opacity:1}
.pp:focus-visible{outline:none}
.pp:focus-visible .hit{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.pill rect{fill:var(--surface);stroke:var(--line);stroke-width:1}
.pill text{fill:var(--ink);font-family:var(--font-body)}
.pill .pill-sub{fill:var(--accent-ink)}
.pill.hot rect{fill:var(--accent);stroke:var(--accent)}
.pill.hot text{fill:var(--accent-ink)}
.pill.sel rect{fill:var(--ink);stroke:var(--ink)}
.pill.sel text,.pill.sel .pill-sub{fill:var(--surface)}
.flow{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 7;stroke-linecap:round;opacity:.4}
.flowg.hot .flow{opacity:1;stroke-width:3}
@media (prefers-reduced-motion:no-preference){.flow{animation:dash 1.4s linear infinite}.pp.open .halo{animation:pulse 1.8s ease-in-out infinite}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes pulse{50%{opacity:.15}}
.rolepanel{padding:18px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.rp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rp-dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.rolepanel h2{font-size:26px}
.rp-place{font-size:13px;color:var(--muted)}
.rolepanel blockquote{margin:0;padding:10px 14px;border-radius:12px;background:var(--surface2);font-weight:700;border-left:4px solid var(--accent)}
.rp-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.rp-item{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;text-align:left}
.rp-item.on{border-color:var(--ink);font-weight:700}
.rp-open{margin-left:auto;font-size:11px;color:var(--accent);font-weight:700}
.rp-flows{font-size:14px;color:var(--muted)}
.rp-flows b{color:var(--ink)}

.layouts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:560px){.layouts{grid-template-columns:1fr}}
.layout{display:grid;gap:6px;min-width:0;align-content:start}
.page{background:var(--paper);color:#24201F;border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.9;box-shadow:var(--shadow);overflow-x:auto}
.ln{display:flex;gap:8px;white-space:nowrap}
.lno{width:1.4em;flex:none;text-align:right;color:#9A8D84;font-family:var(--font-mono);font-size:11px;padding-top:4px}

/* work list (priority) */
.wl-hint{font-size:13px;color:var(--muted);margin:-4px 0 6px}
.wl-sec{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px;letter-spacing:.04em}
.wl-sec span{background:var(--surface2);border-radius:9px;padding:0 7px;font-size:12px}
.wl{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;padding:10px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;margin-bottom:6px;border-left-width:5px}
.wl:hover{background:var(--surface2)}
.wl-time{font-size:13px;color:var(--muted)}
.wl-main{display:grid;min-width:0}
.wl-name{font-weight:700;font-size:15px}
.wl-next{font-size:13px;color:var(--muted)}
.wl-first{display:inline-block;margin-right:6px;padding:0 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;vertical-align:2px}
.wl.first{box-shadow:0 0 0 2px var(--accent);}
.wl-empty{font-size:14px;padding:4px 2px}
.t-late,.t-fix{border-left-color:var(--bad)} .t-soon,.t-now{border-left-color:var(--sun)} .t-todo{border-left-color:var(--accent)} .t-waiting{border-left-color:var(--line)} .t-done,.t-deferred{border-left-color:var(--ok);opacity:.8}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag-late,.tag-fix{background:var(--bad);color:#FFFFFF}
.tag-soon,.tag-now{background:var(--sun);color:#1D2840}
.tag-todo{background:var(--accent-soft);color:var(--accent)}
.tag-waiting{background:var(--surface2);color:var(--muted)}
.tag-done{background:var(--ok-soft);color:var(--ok)} .tag-deferred{background:var(--surface2);color:var(--muted)}
/* next step */
.nextstep{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;border-left:6px solid var(--accent)}
.nextstep.t-late,.nextstep.t-fix{border-left-color:var(--bad)} .nextstep.t-soon,.nextstep.t-now{border-left-color:var(--sun)} .nextstep.t-waiting{border-left-color:var(--line)}
.ns-skip{font-weight:500;color:var(--muted)}
.ns-label{width:100%;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.ns-body{display:grid;flex:1;min-width:12em}
.ns-body b{font-size:17px}
.ns-body span{font-size:14px;color:var(--muted)}
/* alert bar */
.alertbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);border:2px solid var(--accent)}
.alertbar.bad{background:var(--bad-soft);border-color:var(--bad)}
.alertbar.good{background:var(--ok-soft);border-color:var(--ok)}
.ab-time{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.alertbar{animation:pop .35s ease-out}}
@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
/* work card pop-up */
.dialog.wide{width:min(720px,100%)}
.workcard .station-head{position:sticky;top:-18px;background:var(--surface);padding-block:6px;z-index:1}
.wc-foot{display:flex;justify-content:flex-end;margin-top:14px}
/* shift report */
.report{padding:20px 22px;display:grid;gap:14px;border-top:6px solid var(--accent)}
.rp-head{display:flex;gap:16px;align-items:center}
.avatar.big{width:72px;height:72px}
.avatar.photo{background:var(--surface2);align-items:start}
.avatar.photo img{width:100%;height:auto;display:block}
.report .tag{font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;color:var(--muted)}
.report h1{font-size:clamp(26px,4.4vw,38px);margin-top:4px}
.rp-score{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;padding:12px 16px;border-radius:14px;background:var(--surface2)}
.rp-score > div{display:grid}
.rp-k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.rp-v{font-size:44px;font-weight:900;line-height:1.05}
.grade.g-A{color:var(--ok)} .grade.g-B{color:var(--teal)} .grade.g-C{color:var(--warn)} .grade.g-D{color:var(--bad)}
.rp-count{display:flex !important;gap:10px;align-self:center}
.rp-count span{font-weight:700;padding:4px 12px;border-radius:999px}
.rp-count .ok{background:var(--ok-soft);color:var(--ok)} .rp-count .bad{background:var(--bad-soft);color:var(--bad)}
.rp-msg{font-size:16px}
.rp-lists{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.rp-lists{grid-template-columns:1fr}}
.rp-lists h3{font-size:17px;margin-bottom:6px}
.badlist,.goodlist{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.badlist li,.goodlist li{display:flex;gap:8px;padding:8px 10px;border-radius:10px}
.badlist li{background:var(--bad-soft)} .goodlist li{background:var(--ok-soft)}
.badlist .mono,.goodlist .mono{color:var(--muted);font-size:12px;padding-top:2px}
.rp-result{display:inline-flex;align-items:center;gap:8px;margin:8px 0 4px;padding:4px 6px 4px 4px;border-radius:999px;background:var(--accent-soft)}
.rp-result span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.rp-result b{font-size:16px;padding-right:8px}
.rp-note{font-size:12px;color:var(--muted)}
/* home v2 */
.home{min-height:100%}
.hero2{background:linear-gradient(180deg,var(--map-bg1) 0%,var(--bg) 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero2-in{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:end}
.hero2-copy{padding-bottom:40px;min-width:0}
.hero2-copy .kicker{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;color:var(--accent);margin-bottom:10px}
.hero2-copy h1{font-size:clamp(44px,7.5vw,84px);letter-spacing:.02em;line-height:1.05}
.hero2-copy .lead{font-size:18px;max-width:30em;margin-top:16px}
.hero2-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn.big{min-height:54px;padding:12px 22px;font-size:16px}
.facts{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-size:16px;margin-right:4px}
.hero2-stage{position:relative;min-height:360px;min-width:0}
.stage-shapes i{position:absolute;display:block}
.stage-shapes .s1{width:240px;height:240px;border-radius:50%;background:var(--sun-soft);right:18%;top:6%}
.stage-shapes .s2{width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:120px solid var(--teal-soft);left:4%;top:18%}
.stage-shapes .s3{width:90px;height:90px;background:var(--coral-soft);right:2%;top:40%;transform:rotate(18deg);border-radius:12px}
.stage-cast{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:0;padding-top:30px}
.stage-cast .sc{flex:none}
.stage-cast .mid{width:min(300px,42vw);z-index:2}
.stage-cast .side{width:min(220px,30vw);margin-bottom:0;opacity:.96}
.stage-cast .side.l{margin-right:-46px}
.stage-cast .side.r{margin-left:-46px}
.bust{display:block;width:100%;height:auto}
.bubble{position:absolute;top:8px;left:50%;transform:translateX(-10%);background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:var(--shadow);z-index:3;max-width:min(320px,80%)}
.bubble::after{content:"";position:absolute;left:28px;bottom:-10px;width:16px;height:16px;background:var(--surface);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.desk-edge{height:14px;background:var(--desk);border-top:3px solid var(--desk-edge);margin:0 -40px;position:relative;z-index:4}
.castsec{padding-block:36px 48px}
.castsec-head{display:grid;gap:6px;margin-bottom:18px}
.castsec-head h2{font-size:clamp(26px,3.6vw,36px)}
.castgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.castgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.castgrid{grid-template-columns:1fr}}
.castcard{padding:0;overflow:hidden;display:grid;grid-template-columns:42% minmax(0,1fr);text-align:left;font:inherit;color:inherit;width:100%}
.castcard.open{border:2px solid var(--accent);cursor:pointer}
.castcard.open:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(36,32,31,.12)}
@media (prefers-reduced-motion:no-preference){.castcard{transition:transform .15s,box-shadow .15s}}
.castcard.locked .cc-pic{filter:saturate(.55)}
.cc-pic{position:relative;background:color-mix(in srgb,var(--tint) 18%,var(--surface));display:flex;align-items:flex-end;min-height:100%;padding:22px 4px 0}
.cc-pic .bust{width:100%}
.cc-no{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted)}
.cc-body{padding:14px 14px 14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cc-dept{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.cc-name{font-size:13px;font-weight:700}
.cc-body h3{font-size:17px;line-height:1.35}
.cc-quote{font-size:13px;color:var(--muted);flex:1}

/* 小工具 */
function feed(S,text,kind){ S.feed.push({t:S.t, text, kind:kind||''}); }
/* 交班評分用：記錄做得好與出狀況的事 */
function mark(S,kind,text){ (S.marks=S.marks||[]).push({t:S.t,kind,text}); }
/* 新狀況提醒條 */
function alertMe(S,text,station,kind){ S.alert={text,station,kind:kind||'',t:S.t}; }
function fx(S,o){
  ['en','q','co'].forEach(k=>{ if(o[k]){ S[k]=clamp(S[k]+o[k],0,100); if(o.why && o.why[k]) S.why[k]=o.why[k]; } });
}
function schedule(S,at,id,data){ S.timers.push({at, id, data:data||{}}); }
function rec(S,key,label,outcome){ S.decisions = S.decisions.filter(d=>d.key!==key); S.decisions.push({key,label,t:S.t,outcome:[outcome]}); }
function recAdd(S,key,text){ const d=S.decisions.find(d=>d.key===key); if(d) d.outcome.push(text); }
function ring(S,call,data){
  const c={id:call, at:S.t, data:data||{}, answered:false, seen:false};
  if(S.phone) S.phoneQueue.push(c); else S.phone=c;
  { const cc=R.CALLS[call]; feed(S, cc.scene ? cc.label : '電話響了：'+cc.from, 'call'); }
}
function cancelPrinterCall(S){
  // 檔案要撤回重做時，印刷廠對舊檔的來電不再成立；重新上傳後會再確認一次
  S.timers=S.timers.filter(x=>x.id!=='ring_printer');
  S.phoneQueue=S.phoneQueue.filter(c=>c.id!=='printer');
  if(S.phone && S.phone.id==='printer') nextPhone(S);
  S.fired.printer=false;
}
function nextPhone(S){ S.phone=null; S.countdown=null; if(S.phoneQueue.length){ S.phone=S.phoneQueue.shift(); S.phone.at=S.t; S.phone.seen=true; } }

function timeoutCall(S){
  if(!S.phone) return;
  const key='to_'+S.phone.id;
  if(S.fired[key]) return;              // 超時只結算一次
  S.fired[key]=true;
  const c=R.CALLS[S.phone.id];
  const text=c.timeout(S);
  feed(S,'超時：'+text,'bad');
  S.last={label:'來電超時：'+c.from, from:S.t, to:S.t, text, d:{en:0,q:0,co:0}}; S.lastStation='phone';
  nextPhone(S);
}

/* ---------- 推進時間 ---------- */
function advance(S,min){
  const target=S.t+min;
  for(;;){
    const due=S.timers.filter(x=>x.at<=target).sort((a,b)=>a.at-b.at)[0];
    if(!due) break;
    S.timers.splice(S.timers.indexOf(due),1);
    S.t=Math.max(S.t,due.at);
    const h=R.EVENTS[due.id]; if(h) h(S,due.data||{});
  }
  S.t=Math.max(S.t,target);
  // 只計算玩家「看得到」來電之後的時間：行動途中響起的電話，從行動結束時開始算
  if(S.phone && (R.CALLS[S.phone.id].timed||R.CALLS[S.phone.id].expires) && !S.phone.answered && S.phone.seen && S.t-S.phone.at>=CONFIG.missedCallAfter){
    feed(S,R.CALLS[S.phone.id].from+' 的電話響了很久沒人接。','bad');
    timeoutCall(S);
  }
  if(S.phone && !S.phone.seen){ S.phone.seen=true; S.phone.at=S.t; }
}

function cMinutes(S){ const c=S.C.cls; return (c[1]&&c[1]!=='next'?5:0)+(c[2]&&c[2]!=='next'?15:0); }

const actionsAt = (S,st)=> R.ACTIONS.filter(a=>(Array.isArray(a.st)?a.st.includes(st):a.st===st) && a.when(S));
const availOf = (a,S)=> a.avail ? a.avail(S) : true;
function productiveLeft(S){
  if(S.phone) return true;
  return R.ACTIONS.some(a=>!a.rest && a.when(S) && availOf(a,S)===true);
}

function doAction(S,act){
  const c=L(act.cost,S); const from=S.t; const before={en:S.en,q:S.q,co:S.co};
  const label=L(act.label,S);
  if(c.en) S.en=clamp(S.en-c.en,0,100);
  if(c.en>0) S.why.en='「'+label+'」花了 '+c.min+' 分鐘。';
  const text=act.run(S,S.t+c.min);
  feed(S,label+'：'+text,'');
  advance(S,c.min);
  S.last={label, from, to:S.t, text, d:{en:S.en-before.en,q:S.q-before.q,co:S.co-before.co}};
}

/* ---------- 任務狀態顯示 ---------- */
const STATUS = {todo:'待處理', doing:'進行中', waiting:'等待回覆', done:'已完成', late:'已逾期', fix:'需補救', deferred:'已安排延後'};
function taskView(S,k){
  const m=R.TASK_META[k]; let st='todo', note='';
  if(k==='A'){
    const s=S.A.stage;
    ({await:['waiting','等小禾傳來最後確認的文字'], new_edit:['todo','小禾傳來「最後一個小修改」'], wait_final:['waiting','等小禾彙整最終版'],
      final_ready:['todo','最終版到了，可以套入'], proof:['doing','下一步：校對'+(S.flags.needLoc&&!S.A.locDone?'；還要補上課地點':'')], output:['doing','下一步：輸出上傳'+(S.flags.needLoc&&!S.A.locDone?'；還要補上課地點':'')],
      fix:['fix','第二份修改來了，要重新排版'], fix_loc:['fix','要補上課地點並重新上傳'], uploaded:['waiting','等印刷廠確認收件'],
      refix:['fix','字型問題，要修正後重傳'], deferred:['deferred','已協調明早送印'], done:['done',(S.flags.aLateUpload?'已上傳，明早排印':'已送印')]}[s]||['todo','']).forEach((v,i)=>i?note=v:st=v);
    if(S.flags.aLate && !['done','deferred','uploaded'].includes(s)){ st='late'; note='今天收件已截止。仍可完成上傳，明早排印、到貨晚一天。'; }
  }
  if(k==='B'){
    const s=S.B.stage;
    ({brief:['todo','需求單上，日期和費用寫著「待確認」'], asking:['waiting','等宜蓁確認日期和費用'], info_ok:['todo','資訊確認了，可以做完整版'],
      azhe_making:['waiting','阿哲正在做預告版'], teaser_made:['doing','預告版好了，下一步：送主管審核'], full_made:['doing','完整版好了，下一步：送主管審核'],
      draft_made:['doing','暫定版好了，下一步：送主管審核'], review:['waiting','等主管 Mia 審核'], rejected:['fix','主管退回：資訊未確認'],
      review_tomorrow:['deferred','明天一早送審'], published:['done', S.B.pub==='full'?'已發布完整版':'已發布預告版，正式版待資訊確認']}[s]).forEach((v,i)=>i?note=v:st=v);
  }
  if(k==='D'){
    const s=S.D.stage;
    ({none:['waiting','還沒收到文字'], choose:['todo','定稿文字到了，選一種排版輸出'], proof:['waiting','等小宇校對'],
      fix:['fix','小宇校對退回：斷行要調整'], done:['done','校對通過']}[s]).forEach((v,i)=>i?note=v:st=v);
    if(S.t>=T(17,30) && ['choose','fix'].includes(s)){ st='late'; note='已過交件時間，仍可交出，小宇明天校對。'; }
  }
  if(k==='C'){
    const s=S.C.stage;
    ({new:['todo','徐老師留了 4 點意見'], reviewed:['doing','分類老師的意見，回覆工廠'], factory_q:['waiting','等工廠確認成本與時程'],
      deferred:['deferred','延到明天回覆（量產順延一週）'], done:['done','已回覆工廠'+(S.flags.prodDelay?'，量產延後'+S.flags.prodDelay:'')]}[s]).forEach((v,i)=>i?note=v:st=v);
    if(S.t>=T(16,0) && ['new','reviewed'].includes(s) && S.fired['to_factory_due']){ st='late'; note='工廠已排別的貨。仍可回覆，量產順延一週。'; }
  }
  return {k, name:m.name, from:m.from, due:m.dueText, st, label:STATUS[st], note};
}
const stationOfTask = {A:'desk', B:'rack', C:'sample', D:'desk'};
function nextStationFor(S,k){
  if(k==='B') return ['teaser_made','full_made','draft_made'].includes(S.B.stage)?'boss':(S.B.stage==='info_ok'?'desk':'rack');
  return stationOfTask[k];
}
function workList(S){
  const rows=[];
  if(S.phone) rows.push({key:'phone', time:clock(S.phone.at), name:R.CALLS[S.phone.id].scene ? R.CALLS[S.phone.id].label : '接電話：'+R.CALLS[S.phone.id].from, next:R.CALLS[S.phone.id].timed?'限時事件，接起來要在時間內決定':'有人找你', tag:'now', tagText:'接聽', station:'phone', rank:-1});
  R.taskKeys(S).forEach(k=>{
    const v=R.taskView(S,k), m=R.TASK_META[k], due=R.dueFor?R.dueFor(S,k):m.due, left=due-S.t;
    let rank, tag, tagText;
    if(v.st==='late'){ rank=0; tag='late'; tagText='逾時'; }
    else if(v.st==='fix'){ rank=1; tag='fix'; tagText='需補救'; }
    else if(v.st==='todo'||v.st==='doing'){ const soon=left<=40; rank=(soon?2:3)+left/1000; tag=soon?'soon':'todo'; tagText=soon?'快到期':(v.st==='doing'?'進行中':'待處理'); }
    else if(v.st==='waiting'){ rank=50; tag='waiting'; tagText='等待中'; }
    else { rank=90; tag=v.st; tagText=v.label; }
    rows.push({key:k, time:clock(due), name:m.name, next:v.note, tag, tagText, station:R.nextStationFor(S,k), rank});
  });
  (R.extraRows ? R.extraRows(S) : []).forEach(x=>rows.push(x));
  return rows.sort((a,b)=>a.rank-b.rank);
}
const taskKeys = S => S.D.stage==='none' ? ['A','B','C'] : ['A','B','C','D'];

function nextDeadline(S){
  const list=[];
  if(!['done','deferred','uploaded'].includes(S.A.stage) && S.t<T(17,0)) list.push([T(17,0),'DM 送印']);
  if(['new','reviewed'].includes(S.C.stage) && S.t<T(16,0)) list.push([T(16,0),'打樣回覆']);
  if(!['published','review','review_tomorrow'].includes(S.B.stage) && S.t<T(17,30)) list.push([T(17,30),'宣傳圖送審']);
  if(['choose','fix'].includes(S.D.stage) && S.t<T(17,30)) list.push([T(17,30),'課本排版']);
  list.sort((a,b)=>a[0]-b[0]);
  return list[0] ? clock(list[0][0])+' '+list[0][1] : '今天的期限都過了';
}

const TIMER_LABEL = {final_reply:'小禾回覆', yizhen_reply:'宜蓁回覆', review_result:'主管審核結果', azhe_teaser:'阿哲完成預告版', ring_printer:'印刷廠確認', factory_q:'工廠回覆', print_deadline:'印刷廠收件截止', boss_leave:'主管下班', day_end:'下班', factory_due:'工廠回覆期限', ring:'新來電', second_edit:'新訊息'};
function nextTimer(S){ const n=S.timers.slice().sort((a,b)=>a.at-b.at)[0]; return n?{at:n.at,label:R.TIMER_LABEL[n.id]||'下一個事件'}:null; }

function allResolved(S){ return R.taskKeys(S).every(k=>['done','waiting','deferred'].includes(R.taskView(S,k).st)); }

/* ---------- 結局 ---------- */
function remainingA(S){
  const s=S.A.stage, loc=(S.flags.needLoc&&!S.A.locDone)?10:0;
  return ({proof:25+loc, output:10+loc, refix:10, fix_loc:15, final_ready:(S.A.fit?15:25)+25, new_edit:30+25}[s]);
}

function buildEnding(S,H){
  const f=S.flags, A=S.A;
  const aDone = A.stage==='done' || H.overtime;
  let title, sub;
  if(f.remedy==='R4') title='晚一天，但大家都知道';
  else if(f.remedy==='R2') title='縮小範圍，準時送印';
  else if(f.remedy==='R1'||f.remedy==='R3') title='重工之後，補救成功';
  else if(aDone && f.consolidate) title='一次到位的星期四';
  else if(aDone && f.minEdit) title='先改必要的，其餘下一版';
  else if(aDone) title='三件事都有著落';
  else title='DM 明天繼續，交接寫清楚了';
  if(H.overtime) sub='你留下來加班，把 DM 傳出去了。事情完成了，這也不是唯一的做法。';
  else if(S.en<25) sub='事情都有著落，但你的精力快見底了。下次可以早一點請人支援，或先喘口氣。';
  else if(f.rested) sub='你有休息一下，也把事情交代清楚。這樣的步調明天也走得下去。';
  else sub='不需要清空所有待辦，每件事都有清楚的去向，就是好的收尾。';

  const lists={done:[],wait:[],undone:[]};
  R.taskKeys(S).forEach(k=>{
    const v=R.taskView(S,k);
    if(k==='A' && H.overtime){ lists.done.push(v.name+'（加班完成）'); return; }
    if(v.st==='done') lists.done.push(v.name+'：'+v.note);
    else if(v.st==='waiting'||v.st==='deferred') lists.wait.push(v.name+'：'+v.note+(H[k]?'；'+handoffText(H[k]):''));
    else lists.undone.push(v.name+'：'+v.note+(H[k]?'；'+handoffText(H[k]):''));
  });
  if(S.teacherNote==='todo') lists.undone.push('告知徐老師哪些意見留到下一版'+(H.note?'；'+handoffText(H.note):''));
  if(S.teacherNote==='done') lists.done.push('已告知徐老師哪些意見留到下一版');

  const order=['S1','R','S2','T1','S3','S4','T2','P'];
  const keys=S.decisions.slice().sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key)).filter(d=>d.key!=='P').slice(0,4);
  if(keys.length<3){ const p=S.decisions.find(d=>d.key==='P'); if(p) keys.push(p); }

  let remedy=null;
  const lost=A.lost||0;
  if(f.remedy==='R1') remedy={good:'最終版確認後一次排好，內容和老師確認的一致。', cost:'前面 '+lost+' 分鐘的工作重做，又多等了小禾 30 分鐘。'};
  if(f.remedy==='R2') remedy={good:'準時送印，上課地點這項必要資訊正確。', cost:'前面 '+lost+' 分鐘的排版白做了；介紹文這次沒變完整，小禾要回去說明。'};
  if(f.remedy==='R3') remedy={good:'阿哲同時校對，省下時間，錯誤也更少。', cost:'前面 '+lost+' 分鐘的工作重做；阿哲的科學節攤位海報延到明天。'};
  if(f.remedy==='R4') remedy={good:'不用硬趕，明天有時間把版面排好。', cost:'前面 '+lost+' 分鐘的排版要明天重來；DM 晚一天到。'};

  const hidden=[];
  if(f.oldDM) hidden.push('說明會後，小禾要一一向家長說明 DM 上的資訊已經更新。');
  if(f.expoAzheLate) hidden.push('阿哲下午支援你、傍晚又接下攤位海報改尺寸，今晚得加班。');
  if(f.expoWrong) hidden.push('主管 Mia 要為攤位海報追加補印預算，明天再跑一次印刷。');
  if(f.expoDelay) hidden.push('主管 Mia 去和廠商重排上機時間，攤位海報晚半天到。');
  if(f.remedy==='R4') hidden.push('印刷廠為你調整明早的排程，小禾也要通知營隊說明會改用電子檔。');
  if(f.consolidate||f.remedy==='R1') hidden.push('小禾要回頭向三位老師收齊意見、刪到放得下的字數，才能給你最終版。畫面上你只看到「等待回覆」，這段時間她其實一直在工作。');
  if(f.minEdit||f.remedy==='R2') hidden.push('小禾要回去向老師說明，為什麼介紹文這次沒改，還要把完整版放到報名頁。');
  if(f.azheForA||f.azheForB) hidden.push('阿哲用自己 40 分鐘的空檔支援你，他的科學節攤位海報因此延到明天。');
  if(f.layoutA) hidden.push('研發部小宇校對時，要逐行標出行首標點、被拆開的英文字，再等你重傳。');
  if(f.draftMade) hidden.push('主管 Mia 花時間審了一份資訊還沒確認的稿，最後只能退回。');
  if(S.B.asked) hidden.push('宜蓁為了回答你，去向教學部確認講師檔期，才發現開課日要從 9/7 改到 9/14。');
  if(f.prodDelay) hidden.push('教具量產延後'+f.prodDelay+'，課務和教學端要調整教具開始使用的時間。');
  if(!hidden.length) hidden.push('徐老師為了這 4 點意見，花了一個下午實際試用打樣。');

  let next;
  if(f.directEdit) next='收到「小修改」時，先比對字數，再請委託人一次彙整。這樣第二份修改就不會變成重工。';
  else if(f.draftMade) next='招生資訊還沒確認時，可以先做預告版，或先問清楚再做完整版。主管審核會攔下暫定資訊。';
  else if(f.layoutA) next='排版輸出前，先檢查行首有沒有標點、英文單字有沒有被拆成兩行。';
  else if(f.cMis) next='打樣之後，先分清楚「這版能改、下一版再改、要先問成本」，再回覆工廠。';
  else if(f.factoryTimeout||f.noReview) next='先處理有明確截止的打樣回覆。工廠排機台的時間不會等人。';
  else if(!f.azheForA&&!f.azheForB) next='試試在 14:30 請阿哲支援，看看時間和他的工作會怎麼變。';
  else next='換一個處理順序，例如先回覆工廠，再處理 DM，看看結果有什麼不同。';

  let act;
  if(f.directEdit||f.minEdit||f.remedy) act='下次提出設計修改時，一次附上完整的最終文字，並標出哪些是必要修改、哪些可以等下一版。';
  else if(f.draftMade) act='請設計部做宣傳物前，先確認日期、費用、報名方式都已定案。';
  else act='提出需求前，先問對方：「現在這個階段還能改什麼？大概需要多少時間？」';

  return {title,sub,lists,keys,remedy,hidden:hidden.slice(0,2),next,act};
}
function shiftScore(S,H){
  const marks=(S.marks||[]).slice();
  (R.scoreExtras ? R.scoreExtras(S,H) : []).forEach(m=>marks.push(m));
  if(Object.entries(H).some(([k,v])=>v==='notify')) marks.push({t:S.t,kind:'good',text:'未完成的工作有通知委託方'});
  if(S.flags.rested) marks.push({t:S.t,kind:'good',text:'有休息，保住精力'});
  if((H.overtime?S.en-15:S.en)<25) marks.push({t:S.t,kind:'bad',text:'精力透支'});
  const otKey = R.handoff && R.handoff.overtime && R.handoff.overtime.key;
  const silent=R.taskKeys(S).filter(k=>R.taskView(S,k).st!=='done' && !(k===otKey&&H.overtime) && H[k]==='tomorrow').length;
  if(silent) marks.push({t:S.t,kind:'bad',text:'有 '+silent+' 件未完成的工作只排到明天，沒通知委託方'});
  const good=marks.filter(m=>m.kind==='good'), bad=marks.filter(m=>m.kind==='bad');
  const score=clamp(100-SCORE.perBad*bad.length,0,100);
  const grade=score>=SCORE.A?'A':score>=SCORE.B?'B':score>=SCORE.C?'C':'D';
  return {score,grade,good,bad};
}

const ISO={ox:420, oy:650};
const MAP_W=1060, MAP_H=1010;
const P=(x,y,z)=>[ISO.ox+(x-y)*0.866, ISO.oy+(x+y)*0.5-(z||0)];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const shade=(c,k)=>'color-mix(in srgb, '+c+' '+k+'%, #000)';
const quad=(a,b,c,d)=>pts([a,b,c,d]);
/* 在某個立面上畫平面圖形：plane 'y' 表示 y 為常數的牆面（沿 x 延伸），'x' 表示 x 為常數的牆面（沿 y 延伸） */
const faceMatrix=(plane,[sx,sy])=> plane==='y' ? 'matrix(0.866 0.5 0 1 '+sx+' '+sy+')' : 'matrix(-0.866 0.5 0 1 '+sx+' '+sy+')';

function isoBox(key,{x,y,z=0,w,d,h,c,top}){
  return html`<g key=${key}>
    <polygon points=${quad(P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h))} style=${{fill:shade(c,84)}}/>
    <polygon points=${quad(P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h))} style=${{fill:shade(c,70)}}/>
    <polygon points=${quad(P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h))} style=${{fill:top||c}}/>
  </g>`;
}
function isoHex(key,{cx,cy,r,h,top,side}){
  const v=[0,1,2,3,4,5].map(k=>{ const a=Math.PI/3*k+Math.PI/6; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; });
  const sides=[];
  for(let k=0;k<6;k++){
    const a=Math.PI/3*k+Math.PI/3, nx=Math.cos(a), ny=Math.sin(a);
    if(nx+ny<=0.01) continue;
    const p=v[k], q=v[(k+1)%6];
    sides.push(html`<polygon key=${k} points=${quad(P(p[0],p[1],0),P(q[0],q[1],0),P(q[0],q[1],-h),P(p[0],p[1],-h))} style=${{fill:shade(side,nx>ny?86:72)}}/>`);
  }
  return html`<g key=${key}>${sides}<polygon points=${pts(v.map(p=>P(p[0],p[1],0)))} style=${{fill:top}}/>
    <polygon points=${pts(v.map(p=>P(cx+(p[0]-cx)*.86,cy+(p[1]-cy)*.86,0)))} style=${{fill:'var(--grass)',opacity:.55}}/></g>`;
}
function tree(key,x,y,z,s=1){
  const [sx,sy]=P(x,y,z);
  return html`<g key=${key} transform=${'translate('+sx+' '+sy+') scale('+s+')'} aria-hidden="true">

function roundTable(key,cx,cy,z,r,h,c){

    parts.push(isoBox('wb'+f,{x:x-8,y:y,z:z+8,w:8,d:d+8,h:fh-8,c:'var(--slab)'}));

/* ---- 同事留言板（共用資料：每人一份文件 board/<id>，裡面放自己的留言） ---- */
const BOARD_MAX = 300;
const fmtWhen = ms => { const d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function Board({back, backLabel, dept}){
  const [api,setApi]=useState(undefined);      // undefined：連線中；null：無法使用
  const [posts,setPosts]=useState([]);
  const [names,setNames]=useState({});
  const [err,setErr]=useState('');
  const [from,setFrom]=useState(dept||'design');
  const [to,setTo]=useState('');
  const [text,setText]=useState('');
  const [anon,setAnon]=useState(false);
  const [busy,setBusy]=useState(false);
  const [filter,setFilter]=useState('all');
  const [pend,setPend]=useState(null);
  useEffect(()=>{
    let alive=true, unsub=null;
    (async()=>{
      const c=window.claude;
      if(!c || !c.use){ setApi(null); return; }
      const [db,user]=await Promise.all([c.use('db'), c.use('user')]);
      if(!alive) return;
      if(!db){ setApi(null); return; }
      const uid = user ? await user.id() : null;
      const owner = user ? await user.isOwner() : false;
      const canWrite = user ? await user.can('data.write') : null;
      if(!alive) return;
      setApi({db,user,uid,owner,canWrite});
      unsub = db.collection('board').onSnapshot(snap=>{
        const all=[];
        snap.docs.forEach(d=>{ const v=d.data()||{}; (Array.isArray(v.posts)?v.posts:[]).forEach(p=>{ if(p && typeof p.text==='string') all.push(Object.assign({},p,{author:d.id})); }); });
        all.sort((a,b)=>(b.at||0)-(a.at||0));
        setPosts(all);
      }, e=>setErr('留言板暫時無法更新，請稍後重新整理。'));
    })();
    return ()=>{ alive=false; if(unsub) unsub(); };
  },[]);
  useEffect(()=>{
    if(!api || !api.user) return;
    const ids=[...new Set(posts.filter(p=>!p.anon).map(p=>p.author))];
    if(!ids.length) return;
    let alive=true;
    api.user.profiles(ids).then(ps=>{ if(alive) setNames(ps); });
    return ()=>{ alive=false; };
  },[api,posts]);
  const deptName = id => (ROLES.find(r=>r.id===id)||{}).name || '';
  const writeMine = async (uid, fn)=>{
    const ref=api.db.doc('board/'+uid);
    const snap=await ref.get();
    const cur = snap.exists && Array.isArray((snap.data()||{}).posts) ? snap.data().posts : [];
    await ref.set({posts: fn(cur.slice())});
  };
  const submit = async ()=>{
    const t=text.trim(); if(!t || busy) return;
    setBusy(true); setErr('');
    const post={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), dept:from, to, text:t.slice(0,BOARD_MAX), anon, at:Date.now()};
    try{ await writeMine(api.uid, cur=>cur.concat([post]).slice(-50)); setText(''); }
    catch(e){ setErr(e && e.code==='quota_exceeded' ? '留言板已經滿了，請聯絡管理者整理舊留言。' : '留言沒有送出，可能是你的權限只能瀏覽。'); }
    setBusy(false);
  };
  const remove = async p=>{
    setPend(null); setErr('');
    try{ await writeMine(p.author, cur=>cur.filter(x=>x.id!==p.id)); }
    catch(e){ setErr('刪除失敗，請稍後再試。'); }

          ${ROLES.map(r=>html`<button key=${r.id} className=${'chipf'+(filter===r.id?' on':'')} onClick=${()=>setFilter(r.id)}><span className="rp-dot" style=${{background:roleColor(r.id)}}></span>${r.name}</button>`)}

        ${shown.map(p=>{ const nm = p.anon ? '匿名同事' : ((names[p.author]&&names[p.author].name) || '同事');

          const pid = (p.to && ROLES.some(r=>r.id===p.to)) ? p.to : (ROLES.some(r=>r.id===p.dept) ? p.dept : 'design');
          return html`<article key=${p.author+p.id} className="card post" style=${{'--tint':roleColor(pid)}}>

            <div className="post-body">

              <p className="post-text">${p.text}</p>
              ${(mine || api.owner) && (pend===p.author+p.id

    if(showA && !grp) parts.push(html`<div key="a"><b>${v.name}</b>　<${Chip} st=${v.st}>${v.label}</${Chip}><br/><span className="muted">${v.note}</span></div>`);
    if(showA && S.A.stage==='new_edit'){
      parts.push(S.flags.compared ? html`<div key="diff" className="diff">
          <div><b>原本（${COPY_OLD.length} 字）</b><br/>${COPY_OLD}</div>
          <div><b>修改後（${COPY_OLD.length+COPY_ADD.length} 字）</b><br/>${COPY_OLD}<mark>${COPY_ADD}</mark></div>
        </div>` : html`<div key="msg" className="muted">小禾的信：「只是把介紹寫完整一點，應該很快！」（附件：DM 文字_v3_final.docx）</div>`);

      <div className="layouts">${(S.D.stage==='choose'?['A','B']:['A']).map(v=>html`<div key=${v} className="layout"><b>${v} 版</b><div className="page">${LAYOUT[v].map((ln,i)=>html`<div key=${i} className="ln">${ln}</div>`)}</div></div>`)}</div></div>`);
    if(S.B.stage==='info_ok') parts.push(html`<div key="b" className="muted">秋季課資訊已確認，可以在這裡製作完整版宣傳圖。</div>`);

    const row=(k,v,c)=>html`<div key=${k}><span className="muted">${k}</span><span>${v}</span><${Chip} st=${c?'done':'waiting'}>${c?'已確認':'待確認'}</${Chip}></div>`;
    const v=R.taskView(S,'B');
    return html`<div className="info"><div><b>需求單：秋季週末數學探索班</b>　<${Chip} st=${v.st}>${v.label}</${Chip}></div>
      <div className="form">${row('對象','國小三～四年級',true)}${row('開課日',ok?'9/14（六）':'9/7（六）暫定',ok)}${row('費用',ok?'3,200 元':'—',ok)}${row('報名方式','官網報名頁',true)}</div>
      <div className="muted">委託人宜蓁：「希望今天就能發，家長一直在問。」</div></div>`;
  }
  if(id==='sample'){
    const v=R.taskView(S,'C');
    const head=grp?null:html`<div><b>${v.name}</b>　<${Chip} st=${v.st}>${v.label}</${Chip}><br/><span className="muted">${v.note}</span></div>`;
    if(S.C.stage==='new') return html`<div className="info">${head}<div className="muted">打樣到了，徐老師貼了 4 張便利貼。工廠要在 16:00 前收到回覆。</div></div>`;
    if(S.C.stage!=='reviewed') return html`<div className="info">${head}</div>`;
    return html`<div className="info">${head}<div className="muted">打樣已經做好了，有些修改這版改得動，有些要重開模或重新打樣。依你的判斷分類：</div>
      <div className="cmts">${COMMENTS.map(c=>html`<div className="cmt" key=${c.id}><div>${c.id}. ${c.text}</div>
        <div className="seg" role="group" aria-label=${'意見 '+c.id+' 的分類'}>${CLS.map(([v,l])=>html`<button key=${v} aria-pressed=${S.C.cls[c.id]===v} onClick=${()=>apply(d=>{d.C.cls[c.id]=v;})}>${l}</button>`)}</div></div>`)}</div></div>`;
  }
  if(id==='boss'){
    const v=R.taskView(S,'B');
    return html`<div className="info"><div>主管 Mia 負責審核所有對外宣傳，17:30 下班。</div><div><b>${v.name}</b>　<${Chip} st=${v.st}>${v.label}</${Chip}><br/><span className="muted">${v.note}</span></div></div>`;

  if(id==='phone') return html`<div className="info">${S.phone?'':'目前沒有來電。'}</div>`;
  return null;
}

function ActionButton({a,S,run}){
  const ok=availOf(a,S); const c=L(a.cost,S);
  return html`<button className="act" disabled=${ok!==true || S.dayOver} onClick=${()=>run(a)}>
    <span className="t">${L(a.label,S)}</span>
    <${CostChips} c=${c} who=${a.who}/>
    ${ok!==true ? html`<span className="hint2">目前無法：${ok}</span>` : (a.hint && html`<span className="hint2">${L(a.hint,S)}</span>`)}
  </button>`;
}

function PhonePanel({S,answer}){
  if(!S.phone) return null;
  const c=R.CALLS[S.phone.id];
  if(c.timed) return html`<div className="group"><h3>${c.from} 來電</h3>
    <p>這是<b>限時事件</b>。接起後${S.phone.answered?'':'要在時間內決定'}。響太久沒接也算超時。</p>
    <button className="btn primary" onClick=${()=>answer()}><${Icon} n="phone"/>${c.scene?'立即處理':'接起電話'}</button></div>`;
  return html`<div className="group"><h3>${c.from} 來電</h3><p style=${{color:'var(--ink)'}}>${c.intro(S)}</p>
    ${c.options(S).map(o=>html`<${ActionButton} key=${o.id} a=${{...o,label:o.label,cost:o.cost}} S=${S} run=${()=>answer(o)}/>`)}</div>`;
}

const trimDot = t => String(t||'').replace(/[。．]\s*$/,'');
function ActionButtonV2({a,S,run}){
  const ok=availOf(a,S); const c=L(a.cost,S);
  const parts=[c.min>0?c.min+' 分':'不耗時'];
  if(c.en>0) parts.push('精力 −'+c.en);
  if(c.en<0) parts.push('精力 +'+(-c.en));
  if(a.who) parts.push('牽動'+a.who);
  if(ok!==true) parts.push('目前無法：'+trimDot(ok));
  else if(a.hint) parts.push(trimDot(L(a.hint,S)));
  return html`<button className="act v2a" disabled=${ok!==true || S.dayOver} onClick=${()=>run(a)}>
    <span className="t">${L(a.label,S)}</span><span className="v2-sub">${parts.join(' · ')}</span></button>`;
}
function cardOf(S,g){
  const gt=(R.GROUP_TITLE&&R.GROUP_TITLE[g])||[g,''];
  const f=R.CARD&&R.CARD[g]; const d=f?f(S):{};
  return {tab:d.tab||gt[0], title:d.title||gt[0], meta:d.meta||[], quote:d.quote||'', body:d.body!==undefined?d.body:(f?'':gt[1]), steps:d.steps||null, info:f?!!d.info:true};
}
function CardMeta({meta}){
  const items=meta.filter(Boolean);
  if(!items.length) return null;
  return html`<p className="v2-meta">${items.map((m,i)=>html`<span key=${i}>${i?' · ':''}${typeof m==='string'?m:html`<span><b>${m.hi}</b>${m.t||''}</span>`}</span>`)}</p>`;
}
function CardSteps({steps}){
  return html`<div className="v2-steps" role="list" aria-label="流程">${steps.list.map((x,i)=>html`<span key=${i} className="v2-step" role="listitem">${i?html`<i aria-hidden="true">→</i>`:''}<span className=${'v2-sb'+(i<steps.now?' done':i===steps.now?' now':'')}>${i<steps.now?'✓ ':''}${x}</span></span>`)}</div>`;
}
function StationPanelV2({S,id,run,apply,answer,working,close}){
  const [pickG,setPickG]=useState(null);
  if(!id) return null;
  const acts=actionsAt(S,id);
  const groups={}; const plain=[];
  acts.forEach(a=>{ if(a.grp){ (groups[a.grp]=groups[a.grp]||[]).push(a); } else plain.push(a); });
  const gkeys=Object.keys(groups).sort((a,b)=>(a==='R'?-1:0)-(b==='R'?-1:0));
  const cur = gkeys.includes(pickG) ? pickG : gkeys[0];
  const showLast = S.last && S.lastStation===id;
  const timedRinging = S.phone && R.CALLS[S.phone.id].timed && !S.phone.answered && id!=='phone';
  const C = cur ? cardOf(S,cur) : null;
  return html`<div className="workcard v2" id="station-panel">
    <div className="v2-top">
      ${gkeys.length>1 ? html`<div className="v2-tabs" role="tablist" aria-label="這裡的工作">${gkeys.map(g=>html`<button key=${g} role="tab" aria-selected=${g===cur} className=${'inbox-i v2-tab'+(g===cur?' on':'')} onClick=${()=>setPickG(g)}>${cardOf(S,g).tab}</button>`)}</div>`
        : html`<div className="v2-place">${R.STATIONS[id].name}</div>`}
      <button className="v2-x" onClick=${close} aria-label="回到辦公室">✕ 回到辦公室</button>
    </div>
    ${working && html`<div className="working" role="status"><b>處理中：${working.label}</b><span className="muted">+${working.min} 分鐘</span><div className="pb"><i></i></div></div>`}
    ${!working && showLast && html`<div className="result" role="status"><span className="when">${clock(S.last.from)} → ${clock(S.last.to)}　${S.last.label}</span><div>${S.last.text}</div><${DeltaChips} d=${S.last.d}/></div>`}

    ${!cur && html`<${R.StationInfo} S=${S} id=${id} apply=${apply}/>`}
    ${id==='phone' && html`<${PhonePanel} S=${S} answer=${answer}/>`}

      <h3 className="v2-h">${C.title}</h3>
      <${CardMeta} meta=${C.meta}/>
      ${C.quote && html`<p className="v2-quote">${C.quote}</p>`}
      ${C.body && html`<p className="v2-body">${C.body}</p>`}
      ${C.steps && html`<${CardSteps} steps=${C.steps}/>`}

    ${!acts.length && id!=='phone' && html`<p className="muted" style=${{marginTop:'10px'}}>這裡目前沒有要處理的事。</p>`}
  </div>`;

function Meters({S}){
  const keys=R.taskKeys(S), done=keys.filter(k=>['done','deferred'].includes(R.taskView(S,k).st)).length;
  const word=(v,ws)=> v>=75?ws[0]:v>=55?ws[1]:v>=35?ws[2]:ws[3];
  const items=[
    {n:'工作進度', v:Math.round(done/keys.length*100), w:done+' / '+keys.length+' 件有著落', why:'已完成或已安排延後的工作。', c:'var(--accent)'},
    {n:'品質／正確度', v:S.q, w:word(S.q,['穩定','可接受','有疑慮','需要處理']), why:S.why.q, c:'var(--teal)'},
    {n:'協作順暢度', v:S.co, w:word(S.co,['順暢','尚可','有摩擦','卡住了']), why:S.why.co, c:'var(--violet)'},
    {n:'個人精力', v:S.en, w:word(S.en,['充足','還行','疲倦','快撐不住']), why:S.why.en, c:'var(--sun)'},
  ];
  return html`<div className="meters">${items.map(m=>html`<div className="meter" key=${m.n}>
    <div className="row"><span>${m.n}</span><b>${m.w}</b></div>
    <div className="bar" role="meter" aria-label=${m.n} aria-valuenow=${m.v} aria-valuemin="0" aria-valuemax="100" aria-valuetext=${m.w}><i style=${{width:m.v+'%',background:m.c}}></i></div>
    <div className="why" title=${m.why}>${m.why}</div></div>`)}</div>`;
}

function TaskBoard({S,go}){
  const rows=workList(S);
  const now=rows.filter(r=>r.rank<50), wait=rows.filter(r=>r.rank>=50&&r.rank<90), done=rows.filter(r=>r.rank>=90);
  const row=(r,i,top)=>html`<button key=${r.key} className=${'wl'+(top?' first':'')+' t-'+r.tag} onClick=${()=>go(r.station)}>
      <span className="wl-time mono">${r.time}</span>
      <span className="wl-main"><span className="wl-name">${top?html`<span className="wl-first">優先</span>`:''}${r.name}</span><span className="wl-next">${r.next}</span></span>
      <span className=${'tag tag-'+r.tag}>${r.tagText}</span></button>`;
  return html`<div className="card panel"><h2><${Icon} n="list"/>今日工作單</h2>
    <p className="wl-hint">由上往下處理：逾時、需補救、快到期排在最前面。</p>
    <div className="wl-sec">現在要處理 <span>${now.length}</span></div>
    ${now.length?now.map((r,i)=>row(r,i,i===0)):html`<p className="muted wl-empty">目前沒有要你動手的事。</p>`}
    ${wait.length>0 && html`<div className="wl-sec">等待回覆 <span>${wait.length}</span></div>`}${wait.map(r=>row(r))}
    ${done.length>0 && html`<div className="wl-sec">已完成／已安排 <span>${done.length}</span></div>`}${done.map(r=>row(r))}
  </div>`;
}

function NextStep({S,go,advanceNext}){
  const top=workList(S).find(r=>r.rank<50);
  const nt=nextTimer(S);
  if(S.dayOver) return null;
  if(top) return html`<div className=${'card nextstep t-'+top.tag}>
    <div className="ns-label">建議下一步</div>
    <div className="ns-body"><b>${top.name}</b><span>${top.next}</span></div>
    <button className="btn primary" onClick=${()=>go(top.station)}>前往${R.STATIONS[top.station].name} <${Icon} n="arrow"/></button>
    ${nt && html`<button className="btn small ns-skip" onClick=${advanceNext} title="不處理手上的事，讓時間直接走到下一個事件">推進到 ${clock(nt.at)}（${nt.label}）</button>`}</div>`;
  return html`<div className="card nextstep t-waiting">
    <div className="ns-label">手上的事都在等待中</div>
    <div className="ns-body"><span>可以去茶水角休息，或推進到下一個事件。</span></div>

/* ---- 收工交接 ---- */
function Handoff({S,H,setH,finish}){
  const HO=R.handoff||{};
  const items=[];
  R.taskKeys(S).forEach(k=>{ const v=R.taskView(S,k); if(v.st!=='done') items.push({k,v}); });
  (HO.extras ? HO.extras(S) : []).forEach(x=>items.push(x));
  const ot=HO.overtime, otMin = ot ? ot.minutes(S) : null;
  const canOT = ot && items.some(i=>i.k===ot.key) && otMin && otMin<=40;
  const ready = items.every(i=>H[i.k] || (ot && i.k===ot.key && H.overtime));
  const helperOk = HO.helperOk ? HO.helperOk(S) : true;
  return html`<div className="wrap"><div className="endwrap">
    <div className="card endhead"><div className="tag">${clock(S.t)} · 收工交接</div><h1>交接未完成的工作</h1>
      <p>不必清空所有待辦。把每件事的去向安排清楚，明天的你和同事才接得起來。</p></div>
    ${items.length===0 && html`<div className="card hrow"><b>今天的事都完成了！</b><span className="muted">沒有需要交接的項目。</span></div>`}
    ${items.map(({k,v})=>{
      const opts=[['tomorrow','排進明天第一件'],['notify','通知委託方目前進度與預計時間'],['helper',HO.helperLabel||'交給同事，附上說明']];
      const otOn = ot && k===ot.key && H.overtime;
      return html`<div className="card hrow" key=${k}>
        <div><b>${v.name}</b>　<${Chip} st=${v.st}>${v.label}</${Chip}></div>
        <span className="muted">${v.note}</span>
        <div className="hopts">
          ${opts.map(([o,l])=>html`<button key=${o} aria-pressed=${H[k]===o} disabled=${(o==='helper'&&!helperOk)||otOn} onClick=${()=>setH({...H,[k]:o})}>${l}${o==='helper'&&!helperOk?(HO.helperWhy||'（今天已支援過）'):''}</button>`)}
          ${ot && k===ot.key && canOT && html`<button aria-pressed=${!!H.overtime} onClick=${()=>setH({...H,overtime:!H.overtime,[k]:null})}>留下加班完成（約 ${otMin} 分鐘，精力 −15）</button>`}
        </div></div>`;
    })}
    <div className="endbtns"><button className="btn primary" disabled=${!ready} onClick=${finish}>完成交接，看今天的回顧 <${Icon} n="arrow"/></button>
      ${!ready && html`<span className="muted" style=${{alignSelf:'center'}}>每一件都選好去向後才能下班。</span>`}</div>
  </div></div>`;
}

    <div className="card endsec"><h3>今天的狀態</h3><p className="muted">品質 ${S.q}・協作 ${S.co}・精力 ${H.overtime?Math.max(0,S.en-15):S.en}・重工 ${S.rework} 分鐘。</p></div>

function makeStationBadge(extra){
  return function(S,id){
    if(id==='phone' && S.phone && !R.CALLS[S.phone.id].scene) return {t:'☎', c:'var(--sun)', ring:true, label:'電話響了'};
    const list=actionsAt(S,id).filter(a=>!a.rest && availOf(a,S)===true);

    const e = extra ? extra(S,id) : null;
    if(e) return {t:'…', c:'var(--sun)', label:e};
    return null;
  };
}

function simpleNextDeadline(S){
  const dueOf=k=>R.dueFor?R.dueFor(S,k):R.TASK_META[k].due;
  const list=R.taskKeys(S).map(k=>[k,R.taskView(S,k)]).filter(([k,v])=>!['done','deferred','waiting'].includes(v.st) && S.t<dueOf(k)).map(([k])=>[dueOf(k),R.TASK_META[k].short||R.TASK_META[k].name]);
  list.sort((a,b)=>a[0]-b[0]);
  return list[0] ? clock(list[0][0])+' '+list[0][1] : '今天的期限都過了';
}

    else next='試試把李媽媽的回電交給佩佩，看看下午會不會比較從容。';

    else if(f.bQuick||f.bNoNotify) act='對外資訊有更新時，記得通知課務部一起更新回覆家長的說法。';
    else act='跨部門要資料時，先說清楚用途和期限，對方才能排進時間。';

      DP:S=>({tab:'會議準備', title:'招生對策會議前', meta:[{hi:'15:00',t:' 會議室'}, '執行長要和課務部主管、行銷討論對策']}),
      M:S=>({tab:'招生會議', title:'招生對策會議', quote:'執行長：「第一梯快滿，但第二、三梯只有一半。大家有什麼想法？」'}),
    },
    id:'course', deptName:'課務部', hero:'yun', heroName:'小芸', heroJob:'課務專員', endLabel:'17:30', softEndT:T(17,0),
    TASK_META, EVENTS, CALLS, ACTIONS, GROUP_TITLE, newGame, taskView, taskKeys, nextStationFor, extraRows, StationInfo, buildEnding,
    nextDeadline: simpleNextDeadline, Scene: GenericScene,
    STATIONS: Object.assign(GEN_STATIONS({roster:'名額白板', files:'名單櫃', meeting:'會議室', mate:'佩佩'}), {

/* =========================================================
   部門設定：研發部｜這段文字真的可以這樣寫嗎？

function makeRD(){
  DAY_START = 13*60+30;
  const P_ = {boss:'研發長', an:'設計部 小安', mia:'行銷 Mia', lin:'教學部 林老師', chen:'教學部 陳老師', course:'課務部 小芸', ya:'研發同事 雅雯'};
  const SENT = '圓周率的小數無限延伸，所以裡面一定藏著你的生日。';
  const TASK_META = {
    A:{name:'親子數學展覽文字定稿', short:'展覽文字', from:P_.an, due:T(16,0), dueText:'16:00 前交設計部'},
    B:{name:'新教案試教回饋修訂', short:'試教修訂', from:P_.lin, due:T(17,0), dueText:'今天內修好'},
    C:{name:'行銷要一篇科普文章', short:'科普文章', from:P_.mia, due:T(17,30), dueText:'今天回覆'},
    D:{name:'五天營隊教案設計', short:'營隊教案', from:P_.boss, due:T(17,30), dueText:'今天交接給教學部'},
  };
  const newGame = ()=>baseGame('rd',{
    A:{stage:'new'}, B:{stage:'new'}, C:{stage:'new'}, D:{stage:'meet'}, extra:[],
    timers:[
      {at:T(14,30), id:'d_miss'},
      {at:T(15,20), id:'ring', data:{call:'an'}},
      {at:T(16,20), id:'ring', data:{call:'chen'}},
      {at:T(18,0), id:'day_end'},
    ],
    feed:[{t:0, text:'下午 1:30 回到座位。設計部小安在做親子數學展的展板，15:30 要送印；其中一句「'+SENT+'」要研發部確認說法正確，再給研發長看過。研發長 14:00～14:30 有空討論營隊主題。', kind:''}],
  });
  const addExtra=(S,id,label,min,station,why)=>{ if(!S.extra.find(x=>x.id===id)) S.extra.push({id,label,min,station,why,done:false}); };
  const EVENTS = {
    ring(S,d){ ring(S,d.call,d); },
    d_miss(S){ if(S.D.stage==='meet'){ S.D.stage='missed'; mark(S,'bad','錯過研發長 14:00～14:30 的時段，營隊主題今天無法定案'); feed(S,'14:30 研發長去開另一個會了，營隊主題要等明天。','bad'); } },
    review(S){
      if(S.A.stage!=='review') return;
      if(S.flags.directOK){ S.A.stage='fix'; mark(S,'bad','沒查證就核可，研發長校對時攔下那句話'); fx(S,{q:-4,why:{q:'展覽文字有一句說法不精確。'}}); feed(S,'研發長：「這句不精確，π 是不是包含所有數字組合，數學上還沒證明。設計已經排好版了，要怎麼改？」','bad'); alertMe(S,'研發長攔下展覽文字的一句話','desk','bad'); recAdd(S,'A','研發長校對時攔下，設計部已經排好版。'); }
      else { S.A.stage='layout'; schedule(S,S.t+25,'layout_back'); fx(S,{q:3,why:{q:'展覽文字正確又有趣。'}}); feed(S,'研發長：「這樣寫很好，可以交設計部排版了。排好版記得再看一次。」','good'); alertMe(S,'展覽文字通過研發長確認','desk','good'); recAdd(S,'A','研發長一次確認通過。'); }
    },
    layout_back(S){ if(S.A.stage!=='layout') return; S.A.stage='proofL'; feed(S,'設計部小安：「展覽文字排好版了，PDF 傳給你，送印前麻煩再看一次！」'); alertMe(S,'設計部傳來排好版的展覽文字','desk'); },
    ask_reply(S){ S.D.asked=true; feed(S,'課務部小芸：「今年報名多是小二、小三，家長最常問作品能不能帶回家。」','good'); },
    grade_issue(S){ if(S.D.asked) return; addExtra(S,'adjust','加一份低年級版學習單（今年多是小二）',25,'desk'); mark(S,'bad','沒先問課務部，教案難度和報名年齡層對不上'); feed(S,'課務部小芸：「今年報名多是小二耶，教案的難度好像偏高？」','bad'); alertMe(S,'教案難度要調降','desk','bad'); },
    design_q(S){ addExtra(S,'designQ','回答設計部的素材問題（數量、尺寸、交期）',15,'desk'); feed(S,'設計部小安：「教材要印幾份？拼板要多大？什麼時候要？」','bad'); alertMe(S,'設計部來問教材細節','desk'); },
    b_mismatch(S){ if(S.B.stage!=='onlyPlan') return; S.B.stage='fix'; mark(S,'bad','只改教案沒改學習單，兩邊步驟對不上'); feed(S,'林老師：「教案改了，可是學習單第 2 頁還是舊的步驟，孩子會照學習單做。」','bad'); alertMe(S,'教案和學習單不一致','roster','bad'); },
    day_end(S){ S.dayOver=true; feed(S,'18:00，下班時間到了。'); },
  };
  const CALLS = {
    an:{ from:P_.an, timed:true,
      intro:(S)=> '設計部小安：「小宇，親子數學展的展板 15:30 要送印了！上面那句圓周率的話可以用嗎？」'
        + ({new:'（你還沒處理這句。它寫「π 的小數裡一定藏著你的生日」，但這在數學上還沒被證明，研發長也還沒看過。）',
            ready:'（你處理過這句，但還沒送研發長確認。）',
            review:'（研發長還在看這句，結果還沒出來。）',
            fix:'（研發長說這句不精確，你還沒決定怎麼改。）',
            layout:'（研發長確認過新版文字了，設計部正在排版，你還沒校對排好的檔案。）',
            proofL:'（研發長確認過新版文字了，排好版的檔案在你桌上，還沒校對。）',
            done:'（新版文字研發長確認過，排好版的檔案你也校對了。）'})[S.A.stage] || '',
      options:(S)=>{ const o=[];
        if(['layout','proofL'].includes(S.A.stage)) o.push({id:'u4', label:'排版檔我還在校對，請等我 10 分鐘再送印', cost:{min:2,en:0}, run(S){ S.flags.t1Done=true; S.flags.waitPrint=true; fx(S,{co:-1,why:{co:'設計部要晚 10 分鐘送印。'}}); rec(S,'T1','限時：設計部問那句能不能用','請小安等最終校對完再送印。'); return '小安：「好，我等你看完。」'; }});
        if(S.A.stage==='done') o.push({id:'u1', label:'可以，請用研發長確認、我也校對過的版本送印', cost:{min:2,en:0}, run(S){ S.flags.t1Done=true; mark(S,'good','展覽文字確認後才送印'); rec(S,'T1','限時：設計部問那句能不能用','用確認過的版本送印。'); return '小安收到了，用確認過的版本送印。'; }});
        o.push({id:'u2', label:'這句還沒確認好，先刪掉，版面放插圖', cost:{min:3,en:0}, run(S){ S.flags.t1Done=true; S.flags.dropped=true; if(S.A.stage!=='done'){ S.A.stage='done'; } fx(S,{q:-2,why:{q:'展覽少了一句有趣的說明。'}}); rec(S,'T1','限時：設計部問那句能不能用','先刪掉那一句，展覽少了一個亮點。'); return '小安把那句刪掉，用插圖補版面。'; }});
        if(['new','ready','review','fix'].includes(S.A.stage)) o.push({id:'u3', label:'來不及了，照原本那句送印（正確性還沒確認）', cost:{min:2,en:0}, run(S){ S.flags.t1Done=true; S.flags.printedWrong=true; mark(S,'bad','未經確認的句子先送印'); rec(S,'T1','限時：設計部問那句能不能用','原句送印，開幕前要貼更正貼紙。'); return '小安照原句送印了。'; }});
        return o; },
      timeout(S){ S.flags.t1Done=true; if(['layout','proofL'].includes(S.A.stage)){ S.A.stage='done'; S.flags.layoutSkip=true; mark(S,'bad','沒回覆設計部，排版後還沒校對就送印了'); } else { S.flags.printedWrong = S.A.stage!=='done'; if(S.flags.printedWrong) mark(S,'bad','沒回覆設計部，原句先送印了'); } rec(S,'T1','限時：設計部問那句能不能用','沒來得及回覆，小安照現有的稿送印。'); return '小安等不到回覆，照現有的稿送印。'; },
    },
    chen:{ from:P_.chen, timed:true,
      intro:()=> '「下一堂 5 分鐘後開始，新教案的步驟 3 我要怎麼帶？上一班很多孩子拼不出來。」',
      options:()=>[
        {id:'v1', label:'把步驟 3 拆成兩步：先拼兩個三角形，再拼正方形', cost:{min:5,en:1}, run(S){ S.flags.t2Done=true; mark(S,'good','給試教老師一個馬上能用的調整'); rec(S,'T2','限時：試教老師問步驟 3 怎麼帶','給了馬上能用的調整，這堂課順利。'); return '陳老師說這樣孩子應該做得出來。'; }},
        {id:'v2', label:'請老師先照原教案上', cost:{min:2,en:0}, run(S){ S.flags.t2Done=true; fx(S,{co:-2,why:{co:'陳老師這堂課又卡在步驟 3。'}}); rec(S,'T2','限時：試教老師問步驟 3 怎麼帶','照原教案，孩子又卡在同一步。'); return '陳老師只好照原教案上。'; }},
        {id:'v3', label:'說還在改，下次再說', cost:{min:1,en:0}, run(S){ S.flags.t2Done=true; mark(S,'bad','試教老師來問時沒有給任何調整'); rec(S,'T2','限時：試教老師問步驟 3 怎麼帶','沒給調整，陳老師只能自己想辦法。'); return '陳老師有點無奈地回教室了。'; }},
      ],
      timeout(S){ S.flags.t2Done=true; mark(S,'bad','沒回應試教老師，這堂課又卡在步驟 3'); rec(S,'T2','限時：試教老師問步驟 3 怎麼帶','沒來得及回應，陳老師自己想辦法。'); return '陳老師等不到，自己想辦法上課。'; },
    },
  };
  const ACTIONS = [
    /* 參考書櫃：查證 */
    {id:'a_verify', st:'files', when:S=>['new','fix'].includes(S.A.stage) && !S.flags.verified,
      label:'查證：π 的小數真的包含所有數字組合嗎？', hint:'翻參考書和期刊資料。', cost:()=>({min:10,en:2}),
      run(S){ S.flags.verified=true; fx(S,{q:2,why:{q:'查清楚了這句話的根據。'}}); return '查到了：數學家相信 π 的小數裡會出現任何數字組合，但到現在還沒有人證明（這叫「正規數」猜想）。'; }},
    /* 展覽文字 */
    {id:'a1', st:'desk', grp:'A', when:S=>S.A.stage==='new',
      label:'改寫成正確又有趣的版本，字數不變', who:'設計部', hint:S=>S.flags.verified?'已經查證過，改寫比較快。':'要先查證再改寫。', cost:S=>({min:S.flags.verified?10:20,en:3}),
      run(S){ S.A.stage='ready'; S.flags.verified=true; S.flags.rewrote=true; mark(S,'good','查證後改寫，給設計部字數不變的版本'); rec(S,'A','查證後改寫展覽文字','「數學家相信你的生日藏在 π 裡，但還沒有人證明，你想試試看嗎？」字數不變。'); return '改寫好了，字數不變，設計不用重排。下一步：送研發長確認。'; }},
    {id:'a2', st:'desk', grp:'A', when:S=>S.A.stage==='new',
      label:'這句很吸引人，直接核可', who:'設計部', hint:'最快。', cost:()=>({min:2,en:0}),

    {id:'a_send', st:'meeting', when:S=>S.A.stage==='ready',

      run(S,end){ S.A.stage='review'; schedule(S,end+20,'review'); return '研發長說 20 分鐘內看完。'; }},
    /* 排版後的最終校對 */
    {id:'L1', st:'desk', grp:'L', when:S=>S.A.stage==='proofL',
      label:'逐字比對排版後的檔案：數學符號、換行、圖說', who:'設計部', cost:()=>({min:10,en:2}),
      run(S){ S.A.stage='done'; mark(S,'good','排版後、送印前，回研發部做最終校對'); fx(S,{q:3,why:{q:'排版後的成品也確認過了。'}}); rec(S,'L','排版後的最終校對','抓到 π 被字型換成「n」，以及一處換行把句子切開。'); return '抓到兩處：π 被字型換成了「n」，「但還沒有人證明」被換行切成兩半。已請小安改好，可以送印。'; }},
    {id:'L2', st:'desk', grp:'L', when:S=>S.A.stage==='proofL',
      label:'文字之前確認過了，直接回 OK', hint:'最快。', cost:()=>({min:1,en:0}),

    /* 補救 */
    {id:'R1', st:'desk', grp:'R', when:S=>S.A.stage==='fix',

    const hidden=[];

    if(f.printedWrong) hidden.push('展覽開幕前，行銷要逐一貼上更正貼紙。');

    if(f.cDecline) hidden.push('行銷要另外找外稿，稿子回來還是要研發部審。');
    if(f.partial) hidden.push('研發長明天要再空出時間，把另外兩天的主題定下來。');
    if(!hidden.length) hidden.push('設計部拿到素材清單，才能估算要印多少份、什麼時候交。');
    let next;
    if(f.layoutSkip) next='排好版的成品也要逐字看一次，特別是數學符號和換行。';
    else if(f.directOK) next='吸引人的句子更要查證。先查再改寫，給設計部字數不變的版本，就不用重排。';

    else next='試試把試教回饋交給雅雯，看看營隊教案能不能更早交接。';
    let act;
    if(f.directOK||f.printedWrong) act='請研發部確認文字時，預留查證的時間，不要只問「這句可以嗎」。';
    else if(f.noAsk||f.handFile) act='交出教案、文件時，附上一頁「下一個人怎麼用」的說明。';
    else act='提出內容需求時，先說清楚讀者、用途和期限。';
    return {sub,lists,keys,remedy,hidden:hidden.slice(0,2),next,act};
  }

}

/* =========================================================
   部門設定：財務部｜大家都說今天要付款
   付款順序：取得單據 → 主管簽核 → 立帳 → 撥款（執行長放行）→ 沖帳
   ========================================================= */
function makeFinance(){
  DAY_START = 13*60+30;
  const P_ = {boss:'財務主管 怡君', ceo:'執行長', hui:'財務同事 小慧', yu:'專案部 小琦', an:'設計部 小安', qi:'研發部 小宇', jing:'行政 小晶', lin:'教學部 林老師'};
  const AMT = {A:48000, B:36000, C:125000};
  const LIMIT0 = 180000;
  const money = n => 'NT$'+n.toLocaleString('en-US');
  const PAY = ['A','B','C'];
  const NAME = {A:'A 印刷費', B:'B 活動物資租賃', C:'C 拼板教具'};

    A:{name:'付款 A：教具印製費 '+money(AMT.A), short:'付款 A', from:P_.an, due:T(16,30), dueText:'今天放行'},

    C:{name:'付款 C：營隊拼板教具 '+money(AMT.C), short:'付款 C', from:P_.qi, due:T(16,30), dueText:'今天放行'},
    D:{name:'臨櫃繳營業稅', short:'繳稅', from:P_.boss, due:T(15,30), dueText:'今天截止，銀行 15:30 關櫃'},
    E:{name:'行政小晶的報帳單', short:'報帳單', from:P_.jing, due:T(17,30), dueText:'今天回覆'},
    F:{name:'林老師的代墊請款', short:'代墊請款', from:P_.lin, due:T(17,30), dueText:'今天核對金額'},
  };
  const RECEIPTS = [['文具店：彩色筆一盒','NT$356'],['計程車：搬教具到教室','NT$285'],['五金行：磁鐵片 12 片','每片 NT$35'],['影印店：學習單','NT$172']];
  const F_OK = 356+285+12*35+172, F_FORM = 1203;
  const newGame = ()=>baseGame('finance',{
    A:{stage:'doc'}, B:{stage:'doc', acc:'missing'}, C:{stage:'doc', acct:'odd'}, D:{stage:'new'}, E:{stage:'none'}, F:{stage:'new'},
    relSum:0, limit:LIMIT0,
    timers:[
      {at:T(14,45), id:'ring', data:{call:'yu'}},
      {at:T(15,20), id:'ring', data:{call:'boss'}},
      {at:T(15,40), id:'e_arrive'},
      {at:T(16,30), id:'ceo_out'},
      {at:T(17,30), id:'day_end'},
    ],
    feed:[{t:0, text:'下午 1:30 回到座位。三筆付款的單據都到了，大家都說今天要付；營業稅今天是繳款期限最後一天。林老師也交來一張代墊請款單。', kind:''}],
  });
  const ready = (S,k)=> S[k].stage==='checked' && (k!=='B' || S.B.acc==='ok') && (k!=='C' || ['verified','email'].includes(S.C.acct));
  const inStage = (S,st)=> PAY.filter(k=>S[k].stage===st);
  const sumOf = ks => ks.reduce((a,k)=>a+AMT[k],0);
  const names = ks => ks.join('、');
  const over = S => sumOf(inStage(S,'booked')) + S.relSum > S.limit;
  const day = S => S.t < T(16,30);

  const EVENTS = {
    ring(S,d){ ring(S,d.call,d); },
    acc_back(S){ if(S.B.acc!=='asked') return; S.B.acc='ok'; feed(S,'專案部小琦傳來驗收確認單：物資已點收無誤。','good'); alertMe(S,'B 的驗收確認單補來了','desk','good'); },
    hui_done(S){ S.B.acc='ok'; if(S.B.stage==='fix') S.B.stage='checked'; feed(S,'小慧：「驗收單追到了，B 可以重新送簽。」','good'); alertMe(S,'小慧追到 B 的驗收單','meeting','good'); },
    sign_result(S,d){
      const ok=[], bad=[];
      d.ids.forEach(k=>{ const p=S[k]; if(p.stage!=='sign') return;
        if(k==='B' && S.B.acc!=='ok'){ p.stage='fix'; bad.push(k); mark(S,'bad','B 缺驗收確認就送簽，被主管退件'); rec(S,'R','主管退回 B：缺驗收確認單','急件反而更晚。'); return; }
        if(k==='C' && S.C.acct!=='verified'){ p.stage='checked';
          if(S.C.acct==='email'){ S.C.acct='odd2'; S.flags.cEmailRejected=true; mark(S,'bad','帳戶變更只回信問寄件人，被主管退件'); recAdd(S,'C','主管：「回信問同一個信箱，等於沒確認。要用合約上的電話。」'); }
          else { mark(S,'bad','帳戶有異還沒確認就送簽，被主管退件'); }
          bad.push(k); return; }
        p.stage='signed'; ok.push(k); });
      if(ok.length) feed(S,'主管怡君簽核通過：'+names(ok)+'。下一步：立帳。','good');
      if(bad.length){ feed(S,'主管怡君退回：'+names(bad)+(bad.includes('B')?'（缺驗收確認單）':'')+(bad.includes('C')?'（帳戶變更沒確認）':'')+'。','bad'); alertMe(S,'主管退回 '+names(bad),bad.includes('B')?'meeting':'phone','bad'); }
      else if(ok.length) alertMe(S,'主管簽核通過：'+names(ok),'desk','good');
    },
    lim_reply(S){ S.flags.limitOK=true; S.limit=S.relSum+sumOf(inStage(S,'booked'))+sumOf(inStage(S,'signed'))+sumOf(inStage(S,'checked'))+40000; feed(S,'執行長：「這幾筆都要付，我今天先調高額度。下次快超過時，早一點跟我說。」','good'); alertMe(S,'執行長同意調高今天的額度','mate','good'); },
    released(S,d){ const ks=d.ids.filter(k=>S[k].stage==='release'); ks.forEach(k=>{ S[k].stage='paid'; S.relSum+=AMT[k]; }); if(ks.length){ feed(S,'執行長放行，'+names(ks)+' 撥款完成。下一步：沖帳。','good'); alertMe(S,names(ks)+' 撥款完成','desk','good'); } },
    rel_fail(S,d){ d.ids.forEach(k=>{ if(S[k].stage==='release') S[k].stage='booked'; }); S.flags.limTried=true; mark(S,'bad','超過線上限額直接送放行，整批被銀行系統退回'); feed(S,'銀行系統：本月線上放款額度不足，整批退回。','bad'); alertMe(S,'整批付款被銀行系統退回','mate','bad'); recAdd(S,'LIM','整批被退回，白等了 15 分鐘。'); },
    e_arrive(S){ S.E.stage='new'; feed(S,'行政小晶送來一張報帳單：買教室用品的發票，抬頭寫成個人，也沒有統一編號。'); alertMe(S,'行政小晶送來報帳單','desk'); },
    ceo_out(S){ const left=PAY.filter(k=>['doc','checked','sign','signed','booked','fix'].includes(S[k].stage)); feed(S,'16:30 執行長外出了，今天不能再放行。'+(left.length?'還沒放行：'+names(left)+'。':''), left.length?'bad':''); if(left.length) alertMe(S,'執行長外出，'+names(left)+' 今天放行不了','roster','bad'); },
    day_end(S){ S.dayOver=true; feed(S,'17:30，下班時間到了。'); },
  };

  const CALLS = {
    yu:{ from:P_.yu, timed:true,
      intro:(S)=> '「明天活動的帳篷、桌椅，租賃公司說今天沒收到款就不出貨！今天付得出去嗎？」',
      options:(S)=>{ const o=[];
        if(S.B.acc==='missing') o.push({id:'y1', label:'請他馬上補驗收確認單，補來後今天送簽', cost:{min:3,en:0}, run(S,end){ S.flags.t1Done=true; S.B.acc='asked'; schedule(S,(end||S.t)+20,'acc_back'); mark(S,'good','說清楚還差驗收單，請對方馬上補'); rec(S,'T1','限時：小琦催 B 的付款','說清楚還差驗收單，小琦 20 分鐘內補來。'); return '小琦：「我馬上請現場拍照簽名傳給你！」'; }});
        else o.push({id:'y1', label:'說明目前的進度和還差的環節，16:30 前會有結果', cost:{min:3,en:0}, run(S){ S.flags.t1Done=true; mark(S,'good','回覆進度時說清楚還差哪個環節'); rec(S,'T1','限時：小琦催 B 的付款','說清楚進度，小琦先安撫租賃公司。'); return '小琦：「好，我先跟租賃公司說今天會處理。」'; }});
        o.push({id:'y2', label:'跟他說「今天一定付好」', cost:{min:1,en:0}, run(S){ S.flags.t1Done=true; S.flags.promised=true; rec(S,'T1','限時：小琦催 B 的付款','答應今天一定付好。'); return '小琦放心地掛了電話。'; }});
        o.push({id:'y3', label:'付款要照流程，請他明天再問', cost:{min:1,en:0}, run(S){ S.flags.t1Done=true; mark(S,'bad','沒說明還差什麼，就把急件推到明天'); fx(S,{co:-3,why:{co:'小琦不知道要補什麼。'}}); rec(S,'T1','限時：小琦催 B 的付款','小琦不知道要補什麼，只好再打來。'); return '小琦很著急，不知道該補什麼。'; }});
        return o; },
      timeout(S){ S.flags.t1Done=true; mark(S,'bad','沒接到小琦的電話，活動物資可能出不了貨'); rec(S,'T1','限時：小琦催 B 的付款','沒接到電話，小琦只能乾等。'); return '小琦等不到回覆，只好先跟租賃公司拜託。'; },
    },
    boss:{ from:P_.boss, timed:true,
      intro:(S)=> S.D.stage==='done' ? '「營業稅今天最後一天，繳了嗎？」' : S.t<=T(15,22) ? '「營業稅今天最後一天，銀行 15:30 關櫃，你出發了嗎？」' : '「營業稅今天最後一天，銀行快關櫃了，現在出發也來不及⋯⋯」',
      options:(S)=>{ const o=[];
        if(S.D.stage==='done'){ o.push({id:'b0', label:'繳好了，收據已經歸檔', cost:{min:1,en:0}, run(S){ S.flags.t2Done=true; rec(S,'T2','限時：主管問營業稅','早就繳好了，主管很放心。'); return '主管：「太好了，謝謝。」'; }}); return o; }
        const inTime = S.t<=T(15,22);
        if(inTime) o.push({id:'b1', label:'現在立刻搭計程車去銀行', cost:{min:30,en:10}, run(S){ S.flags.t2Done=true; S.D.stage='done'; S.flags.taxRush=true; fx(S,{co:-1,why:{co:'跑銀行時，其他人找不到你。'}}); rec(S,'T2','限時：主管問營業稅','15:28 衝進銀行，繳完了，但手上的付款停了半小時。'); return '15:28 衝進銀行，繳完了。手上的付款停了半小時。'; }});
        if(inTime && !S.flags.huiBusy) o.push({id:'b2', label:'先問小慧手上的事，請她代跑，交代清楚繳款書和印鑑', cost:{min:5,en:1}, run(S){ S.flags.t2Done=true; S.D.stage='done'; S.flags.huiBusy=true; S.flags.huiTax=true; mark(S,'good','請同事代跑前先確認對方量能，並交代清楚文件'); fx(S,{co:-1,why:{co:'小慧放下自己的對帳去銀行。'}}); rec(S,'T2','限時：主管問營業稅','小慧代跑，關櫃前繳完；她的對帳延到明天。'); return '小慧說手上的對帳可以明天做，拿著繳款書出發了。'; }});
        o.push({id:'b3', label:'明天一早再去繳', cost:{min:1,en:0}, run(S){ S.flags.t2Done=true; S.D.stage='late'; mark(S,'bad','營業稅逾期，要加徵滯納金'); rec(S,'T2','限時：主管問營業稅','明天才繳，逾期要加徵滯納金。'); return '主管：「那會逾期一天，要加滯納金⋯⋯」'; }});
        return o; },
      timeout(S){ S.flags.t2Done=true; if(S.D.stage!=='done'){ S.D.stage='late'; mark(S,'bad','錯過關櫃時間，營業稅逾期要加徵滯納金'); } rec(S,'T2','限時：主管問營業稅','沒回應主管，銀行關櫃了。'); return '銀行關櫃了，營業稅要逾期一天。'; },
    },
  };

  const ACTIONS = [
    /* 比對單據 */
    {id:'cmp', st:'desk', grp:'CMP', when:S=>!S.flags.compared,
      label:'逐筆比對三筆單據：金額、驗收、帳戶', hint:'流程的第一步。', cost:()=>({min:15,en:3}),
      run(S){ S.flags.compared=true; ['A','C'].forEach(k=>{ if(S[k].stage==='doc') S[k].stage='checked'; }); if(S.B.stage==='doc') S.B.stage='checked';
        mark(S,'good','付款前逐筆比對單據'); fx(S,{q:4,why:{q:'三筆的狀況都掌握了。'}}); rec(S,'CMP','逐筆比對三筆單據','發現 B 缺驗收確認、C 的帳戶和上次不同。');
        return 'A 資料齊全。B 少了驗收確認單。C 的收款帳戶和上次付款時不同。'; }},
    {id:'rushB', st:'desk', grp:'CMP', when:S=>!S.flags.compared && S.B.stage==='doc',
      label:'B 最急，先把 B 送主管簽核', hint:'進度最快。', who:'主管', cost:()=>({min:3,en:0}),
      run(S,end){ S.B.stage='sign'; S.flags.rushB=true; schedule(S,end+20,'sign_result',{ids:['B']}); rec(S,'CMP','先把急件 B 送簽','沒比對就送出。'); return 'B 送到主管桌上了，約 20 分鐘後有結果。A、C 還沒比對。'; }},
    /* B：驗收 */
    {id:'askAcc', st:['desk','phone'], grp:'B', when:S=>S.flags.compared && S.B.acc==='missing' && ['checked','fix'].includes(S.B.stage),
      label:'請專案部小琦補驗收確認單', who:'專案部', hint:'等回覆時可以先做別的。', cost:()=>({min:5,en:1}),
      run(S,end){ S.B.acc='asked'; if(S.B.stage==='fix'){ S.B.stage='checked'; S.flags.remedy=S.flags.remedy||'R1'; rec(S,'R','補救：請小琦補驗收單後重送','約 30 分鐘後補來，再送一次簽。'); } schedule(S,end+30,'acc_back'); mark(S,'good','缺件時請需求部門補件'); return '已傳訊給小琦，約 30 分鐘補來。'; }},

      else { st='doing'; note='下一步：送主管簽核'; }
    }
    else if(p.stage==='fix'){ st='fix'; note='主管退回：缺驗收確認單'; }
    else if(p.stage==='sign'){ st='waiting'; note='等主管簽核'; }
    else if(p.stage==='signed'){ st='doing'; note='下一步：立帳'; }
    else if(p.stage==='booked'){ st='doing'; note=over(S)&&!S.flags.limitOK?'下一步：放行，但會超過線上限額':'下一步：送執行長放行'; }
    else if(p.stage==='release'){ st='doing'; note='執行長放行中，約 15 分鐘後撥款'; }
    else if(p.stage==='paid'){ st='doing'; note='已撥款，下一步：沖帳'; }
    else if(p.stage==='closed'){ st='done'; note='已付款並沖帳'; }
    else if(p.stage==='deferred'){ st='deferred'; note='改明天付，已通知申請部門'; }
    if(!day(S) && ['doc','checked','fix','sign','signed','booked'].includes(p.stage)){ st='late'; note='執行長已外出，今天放行不了'; }

  function buildEnding(S,H){
    const f=S.flags;
    const sub = S.en<25 ? '款項有著落，但你的精力快見底了。等簽核的空檔，也可以喘口氣。' : f.rested ? '你有休息一下，也把事情交代清楚。這樣的步調明天也走得下去。' : '急件也不跳過必要的環節，延誤可以補，錯付很難追回。';
    const lists={done:[],wait:[],undone:[]};
    taskKeys(S).forEach(k=>{ const v=R.taskView(S,k);
      if(v.st==='done') lists.done.push(v.name+'：'+v.note);
      else if(v.st==='waiting'||v.st==='deferred') lists.wait.push(v.name+'：'+v.note+(H[k]?'；'+handoffText(H[k]):''));
      else lists.undone.push(v.name+'：'+v.note+(H[k]?'；'+handoffText(H[k]):'')); });
    const order=['CMP','C','R','LIM','F','D','T1','T2','E'];
    const keys=S.decisions.slice().sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key)).slice(0,4);
    let remedy=null;
    if(f.remedy==='R1') remedy={good:'補件後重新送簽，流程沒有跳步。', cost:'B 比原本晚了快一小時，小琦一直在等。'};
    if(f.remedy==='R2') remedy={good:'今天不會再為 B 卡住其他付款。', cost:'小琦要拜託租賃公司明早先出貨。'};
    if(f.remedy==='R3') remedy={good:'你可以繼續處理其他付款。', cost:'小慧放下自己的對帳幫你追件。'};
    const hidden=[];
    if(f.rushB) hidden.push('主管退回 B 時，也要花時間寫退件原因；急件反而更晚。');
    if(f.cEmailRejected) hidden.push('如果那封信是假冒的，錢匯出去就很難追回。主管每天都在幫大家擋這種風險。');
    if(f.limTried) hidden.push('整批被銀行退回後，執行長要重新登入、重新放行。');
    if(f.huiB||f.huiTax) hidden.push('小慧放下月中對帳來幫你，她的對帳延到明天。');
    if(f.fForm) hidden.push('林老師的代墊少拿了 30 元，她要再填一張請款單補回來。');
    if(f.fWrong) hidden.push('代墊金額和收據對不起來，月底結帳時要再花時間找差額。');
    if(f.eBad) hidden.push('抬頭錯誤的發票月底不能入帳，小晶要再跑一次店家，報帳也要重送。');
    if(f.promised && !['paid','closed'].includes(S.B.stage)) hidden.push('小琦已經跟租賃公司說今天會付款，現在要再去道歉協調。');
    if(!hidden.length) hidden.push('一筆付款要經過五個環節、兩位簽核人；你看到的「慢」，是在幫公司擋錯付。');
    let next;
    if(f.rushB) next='越急的付款越要先比對單據，缺什麼先請對方補，才不會被退件。';
    else if(f.cEmailRejected) next='帳戶有異時，用合約上的電話回撥確認，不要回信問同一個信箱。';
    else if(f.limTried||f.limSorted) next='放行前先算一下本月線上額度，快超過時先請示執行長。';
    else if(f.fForm||f.fWrong) next='代墊請款要自己把收據重新加總，特別注意「單價 × 數量」的收據。';
    else if(f.taxRush||S.D.stage==='late') next='等簽核、等補件的空檔，正好可以去銀行繳稅。';
    else next='請小慧代跑銀行，看看時間和她的工作會怎麼變。';
    let act;
    if(f.rushB||f.promised) act='請財務部付款時，一次附齊發票和驗收確認單，並預留簽核和放行的時間。';
    else if(f.cEmailRejected) act='收到「帳戶變更」的通知時，先用原本的聯絡方式確認。';
    else act='請款時把需要付款的日期寫清楚，財務部才能排進放行時間。';
    return {sub,lists,keys,remedy,hidden:hidden.slice(0,2),next,act};
  }
  const base = GEN_STATIONS({roster:'付款進度板', files:'繳稅單櫃', meeting:'財務主管', mate:'執行長'});
  base.files.art='cabinet';
  base.meeting = Object.assign(base.meeting, {art:'colleague', opt:S=>({who:'fboss', chair:'var(--d-finance)'})});
  base.mate = Object.assign(base.mate, {opt:S=>({who:day(S)?'ceo':null, chair:'#3A4256', badge:day(S)?null:'外出'})});
  base.desk = Object.assign(base.desk, {opt:{screen:'var(--teal-soft)'}});
  return {
    dueFor:(S,k)=> R.TASK_META[k].due,
    cardV2:true, CARD,
    id:'finance', deptName:'財務部', hero:'jie', heroName:'小傑', heroJob:'財務專員', endLabel:'17:30', softEndT:T(17,0),
    TASK_META, EVENTS, CALLS, ACTIONS, GROUP_TITLE, newGame, taskView, taskKeys, nextStationFor, extraRows:()=>[], StationInfo, buildEnding,
    nextDeadline: simpleNextDeadline, Scene: GenericScene, STATIONS: base,
    scene:{wall:'單據齊全・流程不跳步', wallW:150, rug:'var(--teal-soft)', floor:'4F'},
    stationBadge: makeStationBadge((S,id)=> id==='meeting' && PAY.some(k=>S[k].stage==='sign') ? '簽核中' : id==='mate' && (PAY.some(k=>S[k].stage==='release') || (S.flags.limAsked && !S.flags.limitOK)) ? '處理中' : id==='desk' && S.B.acc==='asked' ? '等補件' : null),
    TIMER_LABEL:{ring:'新來電', acc_back:'小琦補驗收單', hui_done:'小慧回報', sign_result:'主管簽核結果', lim_reply:'執行長回覆', released:'撥款完成', rel_fail:'銀行系統回覆', e_arrive:'新報帳單', ceo_out:'執行長外出', day_end:'下班'},
    scoreExtras:(S,H)=>{ const m=[]; if(S.flags.promised && !['paid','closed'].includes(S.B.stage)) m.push({t:S.t,kind:'bad',text:'答應小琦今天付款，結果沒付成'}); return m; },
    handoff:{ helperLabel:'交給小慧，附上說明', helperDone:'交給小慧，附上說明', helperOk:S=>!S.flags.huiBusy, helperWhy:'（小慧今天已支援過）' },
    brief:{ sub:'財務部 · 星期三下午', title:'大家都說今天要付款', intro:'你是財務專員<b>小傑</b>。13:30 回到座位，17:30 下班。今天的待辦：', tasks:['A','B','C','D','F'], more:'付款順序：取得單據 → 主管簽核 → 立帳 → 撥款（執行長放行）→ 沖帳。執行長 16:30 外出，銀行 15:30 關櫃。', how:'點辦公室裡的物件（電腦、付款進度板、財務主管、執行長、電話⋯）走過去處理。順序由你決定。' },
    about:'付款順序、超過線上放款限額要請示執行長，依公司提供的說明設計；金額、額度數字和時間為遊戲假設。',
  };
}

    if(!hidden.length) hidden.push('一句「報名頁壞了」，背後是補問、重現、修正、測試、上線五個步驟。');

    else if(f.guessed) next='先用補問卡問清楚裝置、步驟和截圖，等回覆的時間可以先做 NUMINA。';

    else act='問上線日期時，可以順便問「還差哪些步驟」。';

/* =========================================================

function makeProject(){
  DAY_START = 13*60+30;
  const P_ = {partner:'教育局承辦 陳小姐', boss:'專案主管 美玲', jie:'財務部 小傑', venue:'場地方 王先生', lin:'教學部', rd:'研發部', hr:'人資及行政部'};
  const TASK_META = {
    A:{name:'兒童月：合作單位要加兩場、年齡下修', short:'加場需求', from:P_.partner, due:T(17,30), dueText:'今天回覆方案'},
    B:{name:'講師、教材、物資排程', short:'排程', from:'教學、研發、行政', due:T(18,0), dueText:'方案定了就要更新'},
    C:{name:'活動預算表更新', short:'預算表', from:P_.jie, due:T(18,0), dueText:'本週，總額不變'},
    D:{name:'財務部要物資的驗收確認單', short:'驗收單', from:P_.jie, due:T(15,0), dueText:'今天付款要用'},
  };
  const newGame = ()=>baseGame('project',{
    A:{stage:'new'}, B:{stage:'wait'}, C:{stage:'wait'}, D:{stage:'none'}, E:{stage:'none'},
    timers:[
      {at:T(13,40), id:'d_arrive'},
      {at:T(13,50), id:'meet_open'},
      {at:T(14,15), id:'meet_miss'},
      {at:T(16,30), id:'ring', data:{call:'venue'}},
      {at:T(18,0), id:'day_end'},
    ],
    feed:[{t:0, text:'下午 1:30 回到座位。教育局承辦來信：兒童月想加兩場、參與年齡下修到小一，預算和日期不變。14:00 要和對方開會。', kind:''}],
  });
  const planned = S => ['approve','approved','sent'].includes(S.A.stage);
  const EVENTS = {
    ring(S,d){ ring(S,d.call,d); },
    d_arrive(S){ S.D.stage='new'; feed(S,'財務部小傑：「明天活動物資的租賃款，還缺驗收確認單，補來我今天就能送簽。」'); alertMe(S,'財務部來要驗收確認單','files'); },
    boss_reply(S){ S.flags.bossOK=true; feed(S,'主管美玲：「可以評估加場，但不要當場答應。預算總額不能變，方案出來先給我看。」','good'); alertMe(S,'主管回覆了','mate','good'); },
    cap_reply(S){ S.flags.capKnown=true;
      feed(S,'各部門回覆：教學部「講師只夠多一場」；研發部「年齡下修到小一，活動難度要改，要 3 天」；行政「物資可以，但要提早 2 天下單」。','good');
      if(S.A.stage==='promised'){ S.A.stage='fix'; feed(S,'可是你已經跟合作單位說「應該可以」了。','bad'); alertMe(S,'各部門的量能不夠，你已經答應了','desk','bad'); recAdd(S,'T1','各部門回覆：講師只夠多一場，年齡下修要 3 天改活動。'); }
      else alertMe(S,'各部門回覆量能了','desk','good'); },
    meet_open(S){ if(!S.flags.meetStarted){ feed(S,'陳小姐到了，可以進會議室了。'); alertMe(S,'合作單位的會議要開始了','meeting'); } },
    meet_miss(S){ if(S.flags.meetStarted) return; mark(S,'bad','錯過和合作單位的會議'); feed(S,'14:15 你還沒進會議室，陳小姐改打電話來。','bad'); ring(S,'partner',{phone:true}); },
    approve_reply(S){ if(S.A.stage!=='approve') return; S.A.stage='approved'; feed(S,'主管美玲：「方案可以，寄給對方吧。」','good'); alertMe(S,'主管核可方案了','desk','good'); },
    venue_due(S){ if(S.E.stage==='new'){ S.E.stage='late'; mark(S,'bad','答應 30 分鐘內回覆場地方，結果超時'); feed(S,'場地方王先生又打來問：「提早進場到底可不可以？」','bad'); } },
    day_end(S){ S.dayOver=true; feed(S,'18:00，下班時間到了。'); },
  };
  const CALLS = {
    partner:{ from:'會議室：陳小姐', scene:true, timed:true, label:'合作單位要你當場答覆能不能加場',
      intro:(S)=> '陳小姐：「長官很期待，今天能不能先答應加兩場？年齡也一起下修到小一。」'+(S.flags.bossOK?'（主管說過：可以評估，不要當場答應。）':''),
      options:(S)=>[
        {id:'p1', label:'「應該可以，我們會想辦法」', cost:{min:20,en:3}, run(S){ S.flags.t1Done=true; S.A.stage=S.flags.capKnown?'fix':'promised'; S.flags.promised=true; mark(S,'bad','未請示主管，就對外說「應該可以」'); fx(S,{co:4,why:{co:'陳小姐很開心。'}}); rec(S,'T1','限時：合作單位要當場答覆','說「應該可以」，陳小姐很開心。'); if(S.A.stage==='fix') alertMe(S,'各部門的量能不夠，你已經答應了','desk','bad'); return '陳小姐：「太好了，我回去跟長官報告！」'; }},
        {id:'p2', label:'「我們先評估講師、教材和物資，明天中午前提方案」', cost:{min:20,en:3}, run(S){ S.flags.t1Done=true; S.A.stage='eval'; mark(S,'good','不當場承諾，評估後再提方案'); rec(S,'T1','限時：合作單位要當場答覆','說明要先評估，明天中午前提方案。'); return '陳小姐：「好，那我先跟長官說明天給方案。」'; }},
        {id:'p3', label:'「不行，人力不夠」', cost:{min:20,en:3}, run(S){ S.flags.t1Done=true; S.A.stage='eval'; fx(S,{co:-4,why:{co:'陳小姐覺得被直接拒絕。'}}); rec(S,'T1','限時：合作單位要當場答覆','直接拒絕，陳小姐有點錯愕。'); return '陳小姐：「⋯⋯那我回去再跟長官討論。」'; }},
      ],
      timeout(S){ S.flags.t1Done=true; S.A.stage=S.flags.capKnown?'fix':'promised'; S.flags.promised=true; S.flags.silent=true; mark(S,'bad','會議中沒有回應，合作方以為默認同意'); rec(S,'T1','限時：合作單位要當場答覆','沒有回應，合作方以為默認同意。'); return '陳小姐把你的沉默當成同意了。'; },
    },
    venue:{ from:P_.venue, timed:true,
      intro:()=> '「活動當天，前一場結束得早，你們進場時間要提前 1 小時，改成 7:00，可以嗎？」',
      options:()=>[
        {id:'v1', label:'先記下，確認行政和講師能不能配合，30 分鐘內回覆', cost:{min:3,en:0}, run(S,end){ S.flags.t2Done=true; S.E.stage='new'; schedule(S,(end||S.t)+30,'venue_due'); mark(S,'good','場地異動先確認內部，再回覆對方'); rec(S,'T2','限時：場地方要提前進場','先確認內部，30 分鐘內回覆。'); return '王先生：「好，我等你電話。」'; }},
        {id:'v2', label:'「好，沒問題」', cost:{min:1,en:0}, run(S){ S.flags.t2Done=true; S.flags.venueYes=true; mark(S,'bad','沒確認內部就答應提前進場'); rec(S,'T2','限時：場地方要提前進場','直接答應，行政和講師還不知道。'); return '王先生：「謝謝配合！」'; }},
        {id:'v3', label:'「不行，照原本的時間」', cost:{min:1,en:0}, run(S){ S.flags.t2Done=true; S.flags.venueNo=true; fx(S,{co:-3,why:{co:'場地方要重新協調其他單位。'}}); rec(S,'T2','限時：場地方要提前進場','直接拒絕，場地方要重新協調。'); return '王先生：「那我再想辦法⋯⋯」'; }},
      ],
      timeout(S){ S.flags.t2Done=true; S.flags.venueSilent=true; mark(S,'bad','沒回應場地方，對方以為默認同意'); rec(S,'T2','限時：場地方要提前進場','沒接到電話，各部門明早才收到通知。'); return '場地方以為你們同意了，各部門明早才收到通知。'; },
    },
  };
  const ACTIONS = [
    /* 開會前 */
    {id:'a_boss', st:'mate', grp:'A0', when:S=>!S.flags.bossAsked,
      label:'先請示主管：合作單位要加場，可以怎麼回？', who:'主管', hint:'對外變更的決策權在主管。約 20 分鐘回覆。', cost:()=>({min:5,en:1}),
      run(S,end){ S.flags.bossAsked=true; schedule(S,end+20,'boss_reply'); mark(S,'good','對外變更先請示主管'); return '主管說看完手上的信就回你，約 20 分鐘。'; }},
    {id:'a_cap', st:['phone','desk'], grp:'A0', when:S=>!S.flags.capAsked && ['new','eval','promised','fix'].includes(S.A.stage),
      label:'同時詢問教學、研發、行政的量能', who:'教學、研發、行政', hint:'約 40 分鐘後各自回覆。', cost:()=>({min:15,en:3}),
      run(S,end){ S.flags.capAsked=true; schedule(S,end+40,'cap_reply'); mark(S,'good','先問各部門量能，再談方案'); return '已傳訊給三個部門，約 40 分鐘後回覆。'; }},
    {id:'a_meet', st:'meeting', grp:'M', when:S=>!S.flags.meetStarted && S.A.stage==='new',
      avail:S=> S.t<T(13,50) ? '14:00 才開會，13:50 可以先進會議室。' : S.t>T(14,15) ? '會議已經開始很久了。' : true,
      label:'進會議室，和合作單位開會', who:'教育局承辦', cost:()=>({min:20,en:3}),
      run(S,end){ S.flags.meetStarted=true; schedule(S,end,'ring',{call:'partner'}); return '陳小姐說明了長官的想法，接著看向你⋯⋯'; }},
    /* 方案比較 */
    {id:'p1', st:'desk', grp:'P', when:S=>S.A.stage==='eval' && S.flags.capKnown,
      label:'方案：加一場，年齡維持小三到小六', hint:'講師夠、教材不用改。對外要說明為什麼年齡不變。', cost:()=>({min:20,en:4}),
      run(S){ S.A.stage='planned'; S.flags.plan='one'; mark(S,'good','依各部門量能提出可行方案'); rec(S,'P','方案比較','加一場、年齡不變；講師和教材都排得出來。'); return '方案寫好了：加一場、年齡不變，附上原因。下一步：送主管核可。'; }},
    {id:'p2', st:'desk', grp:'P', when:S=>S.A.stage==='eval' && S.flags.capKnown,
